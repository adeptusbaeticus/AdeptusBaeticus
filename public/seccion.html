<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próximamente · Adeptus Baeticus</title>
<link rel="icon" href="/Final_General.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#15171A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Adeptus Baeticus">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.6 Inter,system-ui,sans-serif}
a{color:#D9B25A}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
.nav{position:sticky;top:0;z-index:40;background:#15171A}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.lg{height:44px;width:auto;border-radius:6px;display:block}
/* Estado vacío reutilizable: secciones en preparación. */
.vacio{max-width:620px;margin:56px auto 24px;text-align:center;padding:40px 28px;border:1px dashed #6B6558;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,#232017 0%,#1A1C20 55%,#15171A 100%)}
.vacio .ic{width:132px;height:132px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.vacio .ic svg{width:132px;height:132px}
.vacio .cat{font:600 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#D9B25A;margin:0 0 6px}
.vacio h1{font:700 36px/1.15 Cinzel,Georgia,serif;margin:0 0 10px}
.vacio .chip{display:inline-block;font:600 13px Inter,sans-serif;color:#F0CE82;border:1px solid #D9B25A;border-radius:999px;padding:4px 12px;margin:0 0 16px;background:#2A2618}
.vacio p{color:#CFC9BA;margin:0 auto 24px;max-width:460px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:10px;font:600 15px Inter,sans-serif;text-decoration:none;box-sizing:border-box}
.btn.p{background:#A3211B;color:#fff}.btn.p:hover{background:#B8261F;color:#fff}
.btn.s{border:1px solid #6B6558;color:#ECE7DC;background:#1F2328}.btn.s:hover{border-color:#D9B25A;color:#F0CE82}
.btn:focus-visible{outline:2px solid #D9B25A;outline-offset:2px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:48px;color:#A8A293;font-size:14px}
.ftl{display:flex;gap:20px;flex-wrap:wrap}
.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}
.ftl a:hover{color:#F0CE82;text-decoration:underline}
/* Guías (Recursos, Tutoriales, Necromunda, Blood Bowl) */
.guia{max-width:900px;margin:32px auto 0}
.g-cab{display:flex;gap:22px;align-items:center;margin:0 0 28px}
.g-cab svg{flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.g-tit .cat{font:600 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#D9B25A;margin:0 0 4px}
.g-tit h1{font:700 40px/1.1 Cinzel,Georgia,serif;margin:0 0 10px}
.g-intro{color:#CFC9BA;margin:0;max-width:680px}
.g-bloque{background:#1F2328;border:1px solid #2C3036;border-radius:14px;margin:0 0 14px}
.g-bloque h2{font:700 22px/1.2 Cinzel,Georgia,serif;color:#F0CE82;margin:0}
.g-bloque>summary{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 22px;cursor:pointer;list-style:none;border-radius:14px}
.g-bloque>summary::-webkit-details-marker{display:none}
.g-bloque>summary::after{content:"";flex:none;margin-left:auto;width:10px;height:10px;border-right:2px solid #DCD8C2;border-bottom:2px solid #DCD8C2;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.g-bloque[open]>summary::after{transform:rotate(225deg) translate(-2px,-2px)}
.g-bloque>summary:hover h2{color:#FBE7A8}
.g-bloque>summary:focus-visible{outline:2px solid #D9B25A;outline-offset:-2px}
.g-cuerpo{padding:0 22px 20px}
.g-todo{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}
.g-todo button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #6B6558;background:#15171A;color:#DCD8C2;font:500 13px Inter,sans-serif;cursor:pointer}
.g-todo button:hover{border-color:#B08A45}
html.ab-movil .g-todo button{min-height:44px}
@media (prefers-reduced-motion:reduce){.g-bloque>summary::after{transition:none}}
.g-bloque h3{font:600 13px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#A8A293;margin:16px 0 8px}
.g-bloque p{color:#DCD6C8;margin:0 0 12px}
.g-lista{margin:0 0 12px;padding-left:20px;color:#DCD6C8}.g-lista li{margin:4px 0}
.g-enl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.g-e{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid #2C3036;background:#15171A;color:#ECE7DC;text-decoration:none}
.g-e:hover,.g-e:focus-visible{border-color:#B08A45;outline:none;background:#1A1C20}
.g-e .g-ic{flex:none;display:flex}
.g-e .g-tx{flex:1;min-width:0}.g-e strong{display:block;font-weight:600;line-height:1.3}.g-e .g-tx span{display:block;font-size:13px;color:#A8A293;line-height:1.35;margin-top:2px}
.g-et{flex:none;align-self:flex-start;font:600 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#DCD8C2;border:1px solid #6B6558;border-radius:999px;padding:2px 8px}
.g-et.com{color:#A9B776;border-color:#7C8A4C}
.g-vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:0 0 12px}
.g-enl{align-items:start}
.g-v{display:flex;flex-direction:column;border:1px solid #2C3036;border-radius:12px;background:#15171A;overflow:hidden}
.g-vp,.g-vf{display:block;width:100%;aspect-ratio:16/9;border:0}
.g-vp{position:relative;cursor:pointer;background:radial-gradient(120% 100% at 50% 30%,#2A2618 0%,#15171A 70%);color:#DCD8C2;font:600 14px Inter,sans-serif}
.g-vp:hover .g-play,.g-vp:focus-visible .g-play{transform:scale(1.08);background:#A3211B}
.g-vp:focus-visible{outline:2px solid #D9B25A;outline-offset:-2px}
.g-play{position:absolute;left:50%;top:44%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#7A1A15;border:2px solid #B08A45;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .15s,background .15s}
.g-play::after{content:"";position:absolute;left:25px;top:19px;border-style:solid;border-width:13px 0 13px 21px;border-color:transparent transparent transparent #FBF6E8}
.g-vt{position:absolute;left:0;right:0;bottom:12%;text-align:center;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.g-vpie{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 0}
.g-vpie .g-tx{flex:1;min-width:0}.g-vpie strong{display:block;font-weight:600;line-height:1.3}.g-vpie .g-tx span{display:block;font-size:13px;color:#A8A293;margin-top:2px}
.g-vyt{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font-size:13px;font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){.g-play{transition:none}}
.g-fac{display:flex;flex-wrap:wrap;gap:8px}
.g-fac a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #6B6558;background:#15171A;color:#ECE7DC;text-decoration:none;font-weight:500}
.g-fac a.pdf{border-color:#9C7A35}
.g-fac a small{font-size:11px;color:#A8A293;letter-spacing:.04em}
.g-fac a:hover,.g-fac a:focus-visible{border-color:#D9B25A;color:#F0CE82;outline:none}
.g-mas{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;font-weight:600;text-decoration:none}
@media (max-width:600px){.g-cab{flex-direction:column;align-items:flex-start;gap:12px}.g-cab svg{width:72px;height:72px}.g-tit h1{font-size:30px}.g-bloque>summary{padding:12px 16px}.g-cuerpo{padding:0 16px 16px}.g-bloque h2{font-size:19px}.g-enl{grid-template-columns:1fr}}
@media (max-width:600px){.c{padding-left:16px;padding-right:16px}.vacio{margin-top:28px;padding:32px 18px}.vacio h1{font-size:28px}.acts .btn{flex:1 1 100%}}
</style>
</head>

<div class="c">
  <div class="nav">

    <div class="acts">

    <span>Adeptus Baeticus · <a class="hecho" style="color:#D9B25A;text-decoration:none" href="https://www.instagram.com/frambuhobby/" target="_blank" rel="noopener"><span>Hecho por </span><span translate="no">Frambu</span></a></span>

<script src="/guias.js"></script>
<script>
// Estado vacío de las secciones en preparación (una sola página para todas: la elige la dirección).
const SECCION = {
  "/warhammer-40k/recursos": { cat: "Warhammer 40K", t: "Recursos", ic: "recursos", tx: "Aquí reuniremos los recursos del club para Warhammer 40.000: hojas de referencia, enlaces útiles y material para tus partidas." },
  "/warhammer-40k/tutoriales": { cat: "Warhammer 40K", t: "Tutoriales", ic: "tutoriales", tx: "Aquí encontrarás tutoriales para aprender a jugar a Warhammer 40.000 y a pintar tus miniaturas." },
  "/juegos-de-especialista/necromunda": { cat: "Juegos de especialista", t: "Necromunda", ic: "necromunda", tx: "Estamos preparando el espacio de Necromunda del club: campañas, bandas y partidas." },
  "/juegos-de-especialista/blood-bowl": { cat: "Juegos de especialista", t: "Blood Bowl", ic: "bloodbowl", tx: "Estamos preparando el espacio de Blood Bowl del club: ligas, equipos y partidas." },
};
const ruta = location.pathname.replace(/\.html$/, "").replace(/\/+$/, "");
const s = SECCION[ruta] || { cat: "Adeptus Baeticus", t: "Sección en preparación", ic: "recursos", tx: "Esta sección aún no está disponible." };
document.getElementById("cat").textContent = s.cat;
document.getElementById("titulo").textContent = s.t;
document.getElementById("texto").textContent = s.tx + " Sección en preparación: vuelve pronto.";
document.title = s.t + " · Adeptus Baeticus";
// Secciones con contenido (guias.js): se pinta la guía en lugar del estado vacío.
if (window.abGuia && window.abGuia(ruta, document.getElementById("guia"))) {
  document.getElementById("vacio").hidden = true;
  document.getElementById("guia").hidden = false;
} else if (window.abNav) document.getElementById("ic").appendChild(window.abNav.medalla ? window.abNav.medalla(s.ic, 132) : window.abNav.icono(s.ic, 48));
</script>
<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
</html>
