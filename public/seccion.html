<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.6 Inter,system-ui,sans-serif}
a{color:#D9B25A}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
.nav{position:sticky;top:0;z-index:40;background:#15171A}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.lg{height:44px;width:auto;border-radius:6px;display:block}
/* Estado vacío reutilizable: secciones en preparación. */
.vacio{max-width:620px;margin:56px auto 24px;text-align:center;padding:40px 28px;border:1px dashed #6B6558;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,#232017 0%,#1A1C20 55%,#15171A 100%)}
.vacio .ic{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#343B20;border:2px solid #7C8A4C;color:#DCD8C2;box-shadow:0 0 0 6px rgba(124,138,76,.12)}
.vacio .ic svg{width:48px;height:48px}
.vacio .cat{font:600 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#D9B25A;margin:0 0 6px}
.vacio h1{font:700 36px/1.15 Cinzel,Georgia,serif;margin:0 0 10px}
.vacio .chip{display:inline-block;font:600 13px Inter,sans-serif;color:#F0CE82;border:1px solid #D9B25A;border-radius:999px;padding:4px 12px;margin:0 0 16px;background:#2A2618}
.vacio p{color:#CFC9BA;margin:0 auto 24px;max-width:460px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:10px;font:600 15px Inter,sans-serif;text-decoration:none;box-sizing:border-box}
.btn.p{background:#A3211B;color:#fff}.btn.p:hover{background:#B8261F;color:#fff}
.btn.s{border:1px solid #6B6558;color:#ECE7DC;background:#1F2328}.btn.s:hover{border-color:#D9B25A;color:#F0CE82}
.btn:focus-visible{outline:2px solid #D9B25A;outline-offset:2px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:48px;color:#A8A293;font-size:14px}
.ftl{display:flex;gap:20px;flex-wrap:wrap}
.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}
.ftl a:hover{color:#F0CE82;text-decoration:underline}
@media (max-width:600px){.c{padding-left:16px;padding-right:16px}.vacio{margin-top:28px;padding:32px 18px}.vacio h1{font-size:28px}.acts .btn{flex:1 1 100%}}
</style>
</head>
<body>
<div class="c">
  <div class="nav">
    <a class="brand" href="/"><img class="lg" src="/Final_General.png" alt="">Adeptus Baeticus</a>
    <nav class="menu" aria-label="Navegación principal"></nav><script src="/nav.js"></script>
    <span id="auth"></span>
  </div>
  <main class="vacio" id="vacio" aria-labelledby="titulo">
    <div class="ic" id="ic"></div>
    <p class="cat" id="cat"></p>
    <h1 id="titulo"></h1>
    <span class="chip">Próximamente</span>
    <p id="texto"></p>
    <div class="acts">
      <a class="btn p" href="/warhammer-40k/gran-liga">Ir a la Gran Liga</a>
      <a class="btn s" href="/calendario.html">Ver el calendario</a>
    </div>
  </main>
  <footer class="ft">
    <span>Adeptus Baeticus · <a class="hecho" style="color:#D9B25A;text-decoration:none" href="https://www.instagram.com/frambuhobby/" target="_blank" rel="noopener"><span>Hecho por </span><span translate="no">Frambu</span></a></span>
    <nav class="ftl" aria-label="Enlaces">
      <a href="/privacidad.html">Privacidad</a>
      <a href="https://adeptus-baeticus.blogspot.com" target="_blank" rel="noopener">Blog</a>
      <a href="https://www.instagram.com/adeptusbaeticus/" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
    </nav>
  </footer>
</div>
<script>
// Estado vacío de las secciones en preparación (una sola página para todas: la elige la dirección).
const SECCION = {
  "/warhammer-40k/recursos": { cat: "Warhammer 40K", t: "Recursos", ic: "recursos", tx: "Aquí reuniremos los recursos del club para Warhammer 40.000: hojas de referencia, enlaces útiles y material para tus partidas." },
  "/warhammer-40k/tutoriales": { cat: "Warhammer 40K", t: "Tutoriales", ic: "tutoriales", tx: "Aquí encontrarás tutoriales para aprender a jugar a Warhammer 40.000 y a pintar tus miniaturas." },
  "/juegos-de-especialista/necromunda": { cat: "Juegos de especialista", t: "Necromunda", ic: "necromunda", tx: "Estamos preparando el espacio de Necromunda del club: campañas, bandas y partidas." },
  "/juegos-de-especialista/blood-bowl": { cat: "Juegos de especialista", t: "Blood Bowl", ic: "bloodbowl", tx: "Estamos preparando el espacio de Blood Bowl del club: ligas, equipos y partidas." },
};
const ruta = location.pathname.replace(/\.html$/, "").replace(/\/+$/, "");
const s = SECCION[ruta] || { cat: "Adeptus Baeticus", t: "Sección en preparación", ic: "recursos", tx: "Esta sección aún no está disponible." };
document.getElementById("cat").textContent = s.cat;
document.getElementById("titulo").textContent = s.t;
document.getElementById("texto").textContent = s.tx + " Sección en preparación: vuelve pronto.";
document.title = s.t + " · Adeptus Baeticus";
if (window.abNav) document.getElementById("ic").appendChild(window.abNav.icono(s.ic, 48));
</script>
<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
</html>
