<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adeptus Baeticus</title>
<link rel="icon" href="/Final_General.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:#D9B25A}a:hover{color:#F0CE82}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.bd{width:36px;height:36px;border-radius:8px;background:#D9B25A;color:#15171A;display:flex;align-items:center;justify-content:center;font:700 16px Cinzel,Georgia,serif}
.menu{display:flex;gap:24px;flex-wrap:wrap}
.menu a{color:#ECE7DC;text-decoration:none;font-weight:500;padding:8px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.on{border-color:#D9B25A;color:#ECE7DC}
.hero{padding:72px 0 56px}
h1{font:700 48px/1.1 Cinzel,Georgia,serif;margin:0 0 20px}
.lead{font-size:18px;color:#CFC9BA;margin:0;max-width:760px}
.nw{white-space:nowrap}
h2{font:700 28px Cinzel,Georgia,serif;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding-bottom:64px}
.card{background:#1F2328;border:1px solid #2C3036;border-radius:12px;padding:24px}
.ph{height:160px;border-radius:8px;background:#2A2F36;margin-bottom:16px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{font-size:12px;font-weight:600;color:#15171A;background:#D9B25A;border-radius:999px;padding:2px 10px}
.m{color:#A8A293;font-size:14px}
.post h3{font:600 19px/1.3 Inter,sans-serif;margin:10px 0 8px}
.post h3 a{color:#ECE7DC;text-decoration:none}
.post h3 a:hover{color:#F0CE82}
.post p{margin:0;color:#CFC9BA;font-size:15px}
.lg{height:44px;width:auto;border-radius:6px;display:block}
.md{color:#CFC9BA;font-size:15px;overflow-wrap:anywhere}
.md.corto{max-height:13.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.md p{margin:0 0 10px}
.md h4,.md h5,.md h6{font:600 17px Inter,sans-serif;color:#ECE7DC;margin:12px 0 6px}
.md h5{font-size:16px}.md h6{font-size:15px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid #6B6558}
.md code{background:#15171A;border-radius:4px;padding:1px 5px;font-size:14px}
.md pre{background:#15171A;border-radius:8px;padding:10px;overflow-x:auto;margin:0 0 10px}
.md pre code{padding:0}
.md small{display:block;color:#A8A293;font-size:13px}
.md .sp{background:#2C3036;color:transparent;border-radius:4px;cursor:pointer}
.md .sp.v{color:inherit}
/* Próxima quedada */
.qd{display:flex;gap:24px;align-items:stretch;flex-wrap:wrap;margin-bottom:48px}
.fd{flex:0 0 96px;background:#F0CE82;color:#15171A;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;text-transform:uppercase;font-weight:700}
.fd .dn{font:700 40px/1 Cinzel,Georgia,serif}
.fd .mn{font-size:13px;letter-spacing:.08em}
.qd .cuerpo{flex:1 1 300px;min-width:0}
.qd h3{font:700 24px/1.2 Cinzel,Georgia,serif;margin:0 0 8px}
.qd p{margin:0 0 6px}
.ok{color:#9FD39B;font-weight:600}
.btn{display:inline-block;background:#A3211B;color:#fff;border:0;border-radius:8px;padding:12px 20px;font:600 15px Inter,sans-serif;text-decoration:none;min-height:44px;box-sizing:border-box;margin:8px 8px 0 0}
.btn.alt{background:#1F2328;color:#ECE7DC;border:1px solid #6B6558}
.btn:hover{color:#fff;filter:brightness(1.1)}.btn.alt:hover{color:#ECE7DC}
/* Noticia destacada: imagen a la izquierda y texto a la derecha (apilado en móvil). */
.destacada{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:48px;border-color:#D9B25A}
.destacada .ph{flex:1 1 320px;height:auto;min-height:220px;max-height:420px;margin:0}
.destacada .cuerpo{flex:1 1 360px;min-width:0}
.destacada h3{font:700 26px/1.2 Cinzel,Georgia,serif;margin:8px 0 12px}
.aviso{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#15171A;background:#D9B25A;border-radius:999px;padding:3px 12px;margin-right:8px}
.mas{background:none;border:0;color:#D9B25A;font:600 14px Inter,sans-serif;cursor:pointer;padding:8px 0;min-height:44px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:32px;color:#A8A293;font-size:14px}
.ftl{display:flex;gap:20px;flex-wrap:wrap}
.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}
.ftl a:hover{color:#F0CE82;text-decoration:underline}
</style>
</head>
<body>
<div class="c">
  <div class="nav">
    <a class="brand" href="/"><img class="lg" src="/Final_General.png" alt="">Adeptus Baeticus</a>
    <nav class="menu"><a class="on" href="/">Inicio</a><a href="/calendario.html">Calendario</a><a href="/galeria.html">Galería</a></nav>
    <span id="auth"></span>
  </div>
  <div class="hero">
    <h1>Club de Warhammer 40.000 en Málaga</h1>
    <p class="lead">Club gratuito para noveles. Quedada el primer sábado de cada mes en <span class="nw">2d6 Store</span>.</p>
  </div>
  <section>
    <h2>Próxima quedada</h2>
    <div id="quedada"><span class="m">Cargando...</span></div>
  </section>
  <section id="noticias" hidden>
    <h2>Noticias del club</h2>
    <div id="noticia"></div>
  </section>
  <h2>Últimas entradas del blog</h2>
  <div class="grid" id="posts"><span class="m">Cargando entradas...</span></div>
  <footer class="ft">
    <span>Adeptus Baeticus</span>
    <nav class="ftl" aria-label="Enlaces">
      <a href="https://adeptus-baeticus.blogspot.com" target="_blank" rel="noopener">Blog</a>
      <a href="https://www.instagram.com/adeptusbaeticus/" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
    </nav>
  </footer>
</div>
<script>
const grid = document.getElementById("posts");
const fmt = (d) => new Date(d.replace(" ", "T") + "Z").toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });

// --- Formato de Discord a elementos de la página (sin innerHTML) ---
const RE_INLINE = /(`[^`\n]+`)|(\*\*[\s\S]+?\*\*)|(__[\s\S]+?__)|(~~[\s\S]+?~~)|(\|\|[\s\S]+?\|\|)|(\*(?!\s)[^*\n]+?\*)|(_(?!\s)[^_\n]+?_)|(\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))|(https?:\/\/[^\s<>]+[^\s<>.,;:!?)\]'"])|(<a?:\w+:\d+>)|(<@[!&]?\d+>)|(<#\d+>)/g;

function enlace(href, texto) {
  const a = document.createElement("a");
  a.href = href; a.textContent = texto; a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
  return a;
}

function inline(texto, padre) {
  let last = 0, m;
  RE_INLINE.lastIndex = 0;
  const cosas = [];
  while ((m = RE_INLINE.exec(texto))) { cosas.push([m.index, m[0]]); }
  cosas.forEach(([i, t]) => {
    if (i > last) padre.appendChild(document.createTextNode(texto.slice(last, i)));
    last = i + t.length;
    const envuelve = (tag, inner, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; inline(inner, e); padre.appendChild(e); return e; };
    if (t[0] === "`") { const c = document.createElement("code"); c.textContent = t.slice(1, -1); padre.appendChild(c); }
    else if (t.startsWith("**")) envuelve("strong", t.slice(2, -2));
    else if (t.startsWith("__")) envuelve("u", t.slice(2, -2));
    else if (t.startsWith("~~")) envuelve("s", t.slice(2, -2));
    else if (t.startsWith("||")) { const e = envuelve("span", t.slice(2, -2), "sp"); e.title = "Spoiler: pulsa para verlo"; e.onclick = () => e.classList.add("v"); }
    else if (t[0] === "*" || t[0] === "_") envuelve("em", t.slice(1, -1));
    else if (t[0] === "[") { const k = t.indexOf("]("); padre.appendChild(enlace(t.slice(k + 2, -1), t.slice(1, k))); }
    else if (t.startsWith("http")) padre.appendChild(enlace(t, t));
    else if (t.startsWith("<:") || t.startsWith("<a:")) padre.appendChild(document.createTextNode(":" + t.split(":")[1] + ":"));
    else if (t.startsWith("<@")) padre.appendChild(document.createTextNode("@miembro"));
    else if (t.startsWith("<#")) padre.appendChild(document.createTextNode("#canal"));
  });
  if (last < texto.length) padre.appendChild(document.createTextNode(texto.slice(last)));
}

function markdown(src, box) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let i = 0, par = null;
  const cierra = () => { par = null; };
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      cierra();
      const code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]);
      i++;
      const pre = document.createElement("pre"), c = document.createElement("code");
      c.textContent = code.join("\n"); pre.appendChild(c); box.appendChild(pre);
      continue;
    }
    let m;
    if ((m = /^(#{1,3}) (.+)$/.exec(l))) {
      cierra();
      const h = document.createElement("h" + (m[1].length + 3)); inline(m[2], h); box.appendChild(h); i++; continue;
    }
    if ((m = /^-# (.+)$/.exec(l))) { cierra(); const e = document.createElement("small"); inline(m[1], e); box.appendChild(e); i++; continue; }
    if (/^>>> /.test(l) || /^> /.test(l)) {
      cierra();
      const q = document.createElement("blockquote");
      const resto = /^>>> /.test(l);
      const qs = [];
      if (resto) { qs.push(l.slice(4)); i++; while (i < lines.length) qs.push(lines[i++]); }
      else while (i < lines.length && /^> ?/.test(lines[i]) && lines[i].startsWith(">")) qs.push(lines[i++].replace(/^> ?/, ""));
      markdown(qs.join("\n"), q); box.appendChild(q); continue;
    }
    if (/^\s*[-*] /.test(l) || /^\s*\d+\. /.test(l)) {
      cierra();
      const ol = /^\s*\d+\. /.test(l);
      const lista = document.createElement(ol ? "ol" : "ul");
      while (i < lines.length && (ol ? /^\s*\d+\. /.test(lines[i]) : /^\s*[-*] /.test(lines[i]))) {
        const li = document.createElement("li"); inline(lines[i].replace(/^\s*([-*]|\d+\.) /, ""), li); lista.appendChild(li); i++;
      }
      box.appendChild(lista); continue;
    }
    if (!l.trim()) { cierra(); i++; continue; }
    if (!par) { par = document.createElement("p"); box.appendChild(par); }
    else par.appendChild(document.createElement("br"));
    inline(l, par);
    i++;
  }
}

const $ = (id) => document.getElementById(id);
const localNow = () => { const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 16); };
const fechaLarga = (d) => new Date(d + "T12:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
const nuevo = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const enlaceBtn = (txt, href, cls) => { const a = nuevo("a", cls || "btn", txt); a.href = href; return a; };

// Próxima quedada, con el botón para apuntarse (abre el formulario en el calendario).
Promise.all([
  fetch("/api/events").then((r) => (r.ok ? r.json() : [])),
  fetch("/api/my-registrations").then((r) => (r.ok ? r.json() : null)).catch(() => null),
]).then(([evs, mias]) => {
  const box = $("quedada");
  box.textContent = "";
  const now = localNow();
  const e = evs.filter((x) => x.type === "quedada" && x.starts_at > now).sort((a, b) => (a.starts_at < b.starts_at ? -1 : 1))[0];
  if (!e) { box.appendChild(nuevo("p", "m", "No hay ninguna quedada programada.")); return; }
  const card = nuevo("article", "card qd");
  const fd = nuevo("div", "fd");
  const f = new Date(e.starts_at.slice(0, 10) + "T12:00");
  fd.append(nuevo("span", "dn", String(f.getDate())), nuevo("span", "mn", MESES_CORTOS[f.getMonth()]));
  const c = nuevo("div", "cuerpo");
  const h = nuevo("h3", "", e.title);
  h.setAttribute("translate", "no");
  c.append(h, nuevo("p", "", fechaLarga(e.starts_at.slice(0, 10)) + " · " + e.starts_at.slice(11, 16)));
  if (e.location) { const l = nuevo("p", "m", e.location); l.setAttribute("translate", "no"); c.appendChild(l); }
  const n = e.inscritos || 0;
  // Siempre se muestran las plazas que quedan libres.
  c.appendChild(nuevo("p", "m", (e.capacity
    ? (e.capacity - n > 0 ? "Plazas libres: " + (e.capacity - n) + " de " + e.capacity : "Sin plazas libres (" + n + " de " + e.capacity + " ocupadas)")
    : "Plazas libres: sin límite · " + n + (n === 1 ? " inscrito" : " inscritos"))));
  const enlace = "/calendario.html?evento=" + e.id;
  const r = mias && mias.find((x) => x.id === e.id);
  if (mias === null) c.appendChild(enlaceBtn("Entra con Discord para apuntarte", "/auth/login"));
  else if (r) {
    c.appendChild(nuevo("p", "ok", r.status === "inscrito" ? "Estás inscrito." : "Estás en lista de espera" + (r.posicion ? " (posición " + r.posicion + ")." : ".")));
    c.appendChild(enlaceBtn("Ver mi inscripción", enlace, "btn alt"));
  } else {
    if (e.capacity && n >= e.capacity) c.appendChild(nuevo("p", "m", "No quedan plazas: entrarás en la lista de espera."));
    c.appendChild(enlaceBtn("Apuntarme", enlace + "&apuntarme=1"));
  }
  card.append(fd, c);
  box.appendChild(card);
}).catch(() => { $("quedada").textContent = "No se pudieron cargar los eventos."; });

const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sept", "oct", "nov", "dic"];

// Noticia destacada: el último post publicado desde Discord.
fetch("/api/posts")
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((posts) => {
    const p = posts[0];
    if (!p) return;
    const box = document.getElementById("noticia");
    const art = document.createElement("article");
    art.className = "card destacada";
    const ph = document.createElement("div");
    ph.className = "ph";
    if (p.image_url && p.image_url.startsWith("https://")) {
      const im = document.createElement("img");
      im.src = p.image_url; im.alt = "";
      ph.appendChild(im);
    }
    const cuerpo = document.createElement("div");
    cuerpo.className = "cuerpo";
    const av = document.createElement("span");
    av.className = "aviso"; av.textContent = "Importante";
    const d = document.createElement("span");
    d.className = "m"; d.textContent = fmt(p.created_at) + " · " + p.autor;
    const h = document.createElement("h3");
    h.textContent = p.titulo;
    h.setAttribute("translate", "no");
    const md = document.createElement("div");
    md.className = "md";
    md.setAttribute("translate", "no");
    markdown(p.descripcion, md);
    cuerpo.append(av, d, h, md);
    art.append(ph, cuerpo);
    box.appendChild(art);
    document.getElementById("noticias").hidden = false;
    // Las descripciones muy largas se recortan con «Leer más».
    if (md.scrollHeight > 320) {
      md.classList.add("corto");
      md.style.maxHeight = "18em";
      const b = document.createElement("button");
      b.type = "button"; b.className = "mas"; b.textContent = "Leer más";
      b.setAttribute("aria-expanded", "false");
      b.onclick = () => {
        const abierto = md.classList.toggle("corto") === false;
        md.style.maxHeight = abierto ? "" : "18em";
        b.textContent = abierto ? "Leer menos" : "Leer más";
        b.setAttribute("aria-expanded", String(abierto));
      };
      cuerpo.appendChild(b);
    }
  })
  .catch(() => {});

// Últimas entradas del blog (Blogspot).
fetch("/api/blog")
  .then((r) => r.json())
  .then((posts) => {
    grid.textContent = "";
    if (!posts.length) { grid.textContent = "No se han podido cargar las entradas."; return; }
    posts.slice(0, 8).forEach((p) => {
      const art = document.createElement("article");
      art.className = "card post";
      const ph = document.createElement("div");
      ph.className = "ph";
      if (p.image && p.image.startsWith("http")) {
        const im = document.createElement("img");
        im.src = p.image; im.alt = ""; im.loading = "lazy";
        ph.appendChild(im);
      }
      art.appendChild(ph);
      if (p.tag) {
        const t = document.createElement("span");
        t.className = "tag"; t.textContent = p.tag;
        art.appendChild(t); art.appendChild(document.createTextNode(" "));
      }
      const d = document.createElement("span");
      d.className = "m"; d.textContent = new Date(p.date).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });
      art.appendChild(d);
      const h = document.createElement("h3");
      const a = document.createElement("a");
      a.textContent = p.title;
      a.setAttribute("translate", "no");
      if (p.url && p.url.startsWith("http")) a.href = p.url;
      h.appendChild(a); art.appendChild(h);
      const ex = document.createElement("p");
      ex.textContent = p.excerpt;
      ex.setAttribute("translate", "no");
      art.appendChild(ex);
      grid.appendChild(art);
    });
  })
  .catch(() => { grid.textContent = "No se han podido cargar las entradas."; });
</script>
<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
</html>
