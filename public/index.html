<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adeptus Baeticus</title>
<link rel="icon" href="/Final_General.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:#D9B25A}a:hover{color:#F0CE82}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.bd{width:36px;height:36px;border-radius:8px;background:#D9B25A;color:#15171A;display:flex;align-items:center;justify-content:center;font:700 16px Cinzel,Georgia,serif}
.menu{display:flex;gap:24px;flex-wrap:wrap}
.menu a{color:#ECE7DC;text-decoration:none;font-weight:500;padding:8px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.on{border-color:#D9B25A;color:#ECE7DC}
.hero{padding:72px 0 56px}
h1{font:700 48px/1.1 Cinzel,Georgia,serif;margin:0 0 20px}
.lead{font-size:18px;color:#CFC9BA;margin:0;max-width:600px}
h2{font:700 28px Cinzel,Georgia,serif;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding-bottom:64px}
.card{background:#1F2328;border:1px solid #2C3036;border-radius:12px;padding:24px}
.ph{height:160px;border-radius:8px;background:#2A2F36;margin-bottom:16px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{font-size:12px;font-weight:600;color:#15171A;background:#D9B25A;border-radius:999px;padding:2px 10px}
.m{color:#A8A293;font-size:14px}
.post h3{font:600 19px/1.3 Inter,sans-serif;margin:10px 0 8px}
.post h3 a{color:#ECE7DC;text-decoration:none}
.post h3 a:hover{color:#F0CE82}
.post p{margin:0;color:#CFC9BA;font-size:15px}
.ft{border-top:1px solid #2C3036;padding:32px 0 40px;color:#A8A293;font-size:14px}
.lg{height:44px;width:auto;border-radius:6px;display:block}
</style>
</head>
<body>
<div class="c">
  <div class="nav">
    <a class="brand" href="/"><img class="lg" src="/Final_General.png" alt="">Adeptus Baeticus</a>
    <nav class="menu">
      <a class="on" href="/">Inicio</a>
      <a href="https://adeptus-baeticus.blogspot.com">Blog</a>
      <a href="/calendario.html">Calendario</a>
    </nav>
  </div>
  <div class="hero">
    <h1>Club de Warhammer 40.000 en Málaga</h1>
    <p class="lead">Club gratuito para noveles. Quedada el primer sábado de cada mes en 2d6 Store.</p>
  </div>
  <h2>Últimas entradas del blog</h2>
  <div class="grid" id="posts"><span class="m">Cargando entradas...</span></div>
  <div class="ft">Adeptus Baeticus</div>
</div>
<script>
const grid = document.getElementById("posts");
const fmt = (d) => new Date(d).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });
fetch("/api/blog")
  .then((r) => r.json())
  .then((posts) => {
    grid.textContent = "";
    if (!posts.length) { grid.textContent = "No se han podido cargar las entradas."; return; }
    posts.slice(0, 6).forEach((p) => {
      const art = document.createElement("article");
      art.className = "card post";
      const ph = document.createElement("div");
      ph.className = "ph";
      if (p.image && p.image.startsWith("http")) {
        const im = document.createElement("img");
        im.src = p.image; im.alt = ""; im.loading = "lazy";
        ph.appendChild(im);
      }
      art.appendChild(ph);
      if (p.tag) {
        const t = document.createElement("span");
        t.className = "tag"; t.textContent = p.tag;
        art.appendChild(t); art.appendChild(document.createTextNode(" "));
      }
      const d = document.createElement("span");
      d.className = "m"; d.textContent = fmt(p.date);
      art.appendChild(d);
      const h = document.createElement("h3");
      const a = document.createElement("a");
      a.textContent = p.title;
      if (p.url && p.url.startsWith("http")) a.href = p.url;
      h.appendChild(a); art.appendChild(h);
      const ex = document.createElement("p");
      ex.textContent = p.excerpt;
      art.appendChild(ex);
      grid.appendChild(art);
    });
  })
  .catch(() => { grid.textContent = "No se han podido cargar las entradas."; });
</script>
</body>
</html>
