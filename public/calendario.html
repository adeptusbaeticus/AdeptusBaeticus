<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario · Adeptus Baeticus</title>
<link rel="icon" href="/Final_General.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:#D9B25A}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
/* La cabecera se queda fija arriba al hacer scroll. */
.nav{position:sticky;top:0;z-index:40;background:#15171A}
html{scroll-padding-top:96px}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.lg{height:44px;width:auto;border-radius:6px;display:block}
.menu{display:flex;gap:24px;flex-wrap:wrap}
.menu a{color:#ECE7DC;text-decoration:none;font-weight:500;padding:8px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.on{border-color:#D9B25A}
h1{font:700 34px/1.1 Cinzel,Georgia,serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:40px 0 24px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,.nv{background:#1F2328;color:#ECE7DC;border:1px solid #6B6558;border-radius:999px;padding:8px 13px;min-height:44px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:#D9B25A;color:#15171A;border-color:#D9B25A}
.nv{border-radius:8px;width:44px;padding:0;font-size:20px}
.mes{font:600 18px Inter,sans-serif;min-width:140px;text-align:center}
.lay{display:flex;gap:32px;flex-wrap:wrap;padding-bottom:64px}
.a{flex:2 1 560px}.b{flex:1 1 320px}
.cal{overflow-x:auto}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:560px}
.h{font-size:13px;color:#A8A293;text-align:center;padding:6px 0;font-weight:600}
.d{min-height:92px;background:#1F2328;border-radius:8px;padding:8px;font-size:14px}
.d.n{background:#181B1F}
.d.hoy{box-shadow:inset 0 0 0 2px #D9B25A;background:#262A30}
.d .dn{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:999px;background:#D9B25A;color:#15171A;font-weight:700}
.d .hoy-tag{margin-left:6px;font-size:12px;font-weight:600;color:#D9B25A;text-transform:uppercase;letter-spacing:.06em}
.e{display:block;width:100%;border:0;text-align:left;cursor:pointer;font:600 12px Inter,sans-serif;border-radius:6px;padding:3px 6px;margin-top:6px}
/* Claro: abierto. Oscuro: completo o cerrado. */
.q{background:#F0CE82;color:#15171A}.q.x{background:#8A6416;color:#fff}
.t2{background:#F08A82;color:#15171A}.t2.x{background:#7A1712;color:#fff}
.pt{background:#A8E0A0;color:#15171A}.pt.x{background:#2F6B2A;color:#fff}
.ley{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#A8A293}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{display:inline-block;width:14px;height:14px;border-radius:4px}
.disp{margin:0 0 8px;padding-left:20px}
.dia{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dia .rad{text-transform:capitalize;min-width:130px}
.hh{display:flex;align-items:center;gap:6px;color:#A8A293}
.hh select{width:auto;min-height:40px;padding:6px 8px}
.hh select:disabled{opacity:.45}
.nv.del{display:inline-flex;align-items:center;justify-content:center;color:#F0A39E;border-color:#6B6558}
.nv.del:hover{border-color:#F0A39E}
select.chip{appearance:auto;padding:8px 12px}
.fld input[type=checkbox]{width:18px;height:18px;accent-color:#D9B25A}
.card{background:#1F2328;border:1px solid #2C3036;border-radius:12px;padding:24px}
.lb{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#D9B25A;font-weight:600}
.card h3{font:700 22px/1.2 Cinzel,Georgia,serif;margin:8px 0 12px}
.card p{margin:0 0 8px}
.m{color:#A8A293;font-size:14px}
.btn{display:inline-block;background:#A3211B;color:#fff;border:0;border-radius:8px;padding:12px 20px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:44px;box-sizing:border-box;text-decoration:none;margin-top:8px}
.btn.alt{background:#1F2328;color:#ECE7DC;border:1px solid #6B6558}
.btn:disabled{opacity:.6;cursor:default}
.ok{color:#9FD39B;font-weight:600}
.err{color:#F0A39E;font-size:14px;min-height:20px;margin-top:6px}
.fz{margin-top:8px}
.fld{margin:0 0 12px;border:0;padding:0}
.fld label,.fld legend{display:block;font-weight:600;font-size:14px;margin-bottom:4px;padding:0}
.fld label.rad{display:flex;align-items:center;gap:8px;font-weight:400;font-size:15px;min-height:36px;margin:0}
.fld select{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #6B6558;background:#15171A;color:#ECE7DC;font:inherit;min-height:44px}
.fld input[type=radio]{width:18px;height:18px;accent-color:#D9B25A}
.fz .row{gap:8px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:32px;color:#A8A293;font-size:14px}
.ftl{display:flex;gap:20px;flex-wrap:wrap}
.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}
.ftl a:hover{color:#F0CE82;text-decoration:underline}
/* Transición entre páginas: la cabecera y el pie se quedan quietos; cambia el contenido. */
@view-transition{navigation:auto}
.nav{view-transition-name:cabecera}
.ft{view-transition-name:pie}
::view-transition-old(cabecera),::view-transition-new(cabecera){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style>
</head>
<body>
<div class="c">
  <div class="nav">
    <a class="brand" href="/"><img class="lg" src="/Final_General.png" alt="">Adeptus Baeticus</a>
    <nav class="menu"><a href="/">Inicio</a><a class="on" href="/calendario.html">Calendario</a><a href="/galeria.html">Galería</a><a href="/gran-liga.html">Gran Liga</a></nav>
    <span id="auth"></span>
  </div>
  <div class="top">
    <h1>Calendario</h1>
    <div class="row" id="chips">
      <button class="chip on" data-f="todos">Todos</button>
      <button class="chip" data-f="quedada">Quedadas</button>
      <button class="chip" data-f="torneo">Torneos</button>
      <button class="chip" data-f="partida" id="chp" hidden>Partidas</button>
      <select id="fm" class="chip" aria-label="Modalidad" hidden>
        <option value="">Todas las modalidades</option>
        <option value="combat_patrol">Combat Patrol</option>
        <option value="40k_1000">40k a 1K</option>
        <option value="40k_2000">40k a 2K</option>
        <option value="necromunda">Necromunda</option>
        <option value="bloodbowl">Blood Bowl</option>
      </select>
      <button class="btn" id="bp" type="button" hidden style="margin:0">Buscar partida</button>
      <a class="btn" id="bpl" href="/auth/login" hidden style="margin:0;text-decoration:none">Entra con Discord para buscar partida</a>
      <button class="nv del" id="bdel" type="button" hidden aria-label="Borrar mis partidas" title="Borrar mis partidas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
      </button>
    </div>
    <div class="row">
      <button class="nv" id="prev" aria-label="Mes anterior">‹</button>
      <span class="mes" id="mes"></span>
      <button class="nv" id="next" aria-label="Mes siguiente">›</button>
    </div>
  </div>
  <div class="lay">
    <div class="a"><div class="cal"><div class="g" id="g"></div></div>
      <div class="ley" aria-label="Leyenda">
        <span><i class="q"></i>Quedada</span><span><i class="t2"></i>Torneo</span><span><i class="pt"></i>Partida</span>
        <span>Color claro: abierto · oscuro: completo o cerrado</span>
      </div>
    </div>
    <div class="b"><div class="card" id="det"><p class="m">Selecciona un evento del calendario.</p></div></div>
  </div>
  <footer class="ft">
    <span>Adeptus Baeticus</span>
    <nav class="ftl" aria-label="Enlaces">
      <a href="https://adeptus-baeticus.blogspot.com" target="_blank" rel="noopener">Blog</a>
      <a href="https://www.instagram.com/adeptusbaeticus/" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
    </nav>
  </footer>
</div>
<script>
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $ = (id) => document.getElementById(id);
let ev = [], filtro = "todos";
// Inscripciones del usuario por id de evento; null si no ha iniciado sesión.
let mine = null;
const hoy = new Date();
let y = hoy.getFullYear(), m = hoy.getMonth();

function render() {
  $("mes").textContent = MESES[m] + " " + y;
  const g = $("g");
  g.textContent = "";
  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach((d) => {
    const h = document.createElement("div");
    h.className = "h"; h.textContent = d; g.appendChild(h);
  });
  const off = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < off; i++) {
    const e = document.createElement("div"); e.className = "d n"; g.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const cell = document.createElement("div");
    const key = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const now = localNow();
    cell.className = "d";
    if (key === now.slice(0, 10)) {
      // Día actual: borde dorado, número resaltado y etiqueta «Hoy».
      cell.className = "d hoy";
      cell.setAttribute("aria-current", "date");
      const num = document.createElement("span");
      num.className = "dn";
      num.textContent = d;
      const tag = document.createElement("span");
      tag.className = "hoy-tag";
      tag.textContent = "Hoy";
      cell.append(num, tag);
    } else {
      cell.appendChild(document.createTextNode(d));
    }
    ev.filter((e) => (filtro === "todos" || e.type === filtro) && e.starts_at.startsWith(key))
      .forEach((e) => {
        const b = document.createElement("button");
        const llena = e.type === "quedada" && e.capacity && (e.inscritos || 0) >= e.capacity;
        b.className = "e " + (e.type === "torneo" ? "t2" : "q") + (llena || e.starts_at <= now ? " x" : "");
        b.textContent = e.title;
        b.setAttribute("translate", "no");
        b.onclick = () => show(e);
        cell.appendChild(b);
      });
    if (filtro === "todos" || filtro === "partida") {
      const fm = filtro === "partida" ? $("fm").value : "";
      partidas.filter((p) => partidaDias(p).includes(key) && (!fm || p.activity === fm)).forEach((p) => {
        const b = document.createElement("button");
        b.className = "e pt" + (p.status === "completa" || partidaCerrada(p) ? " x" : "");
        // Hora fijada o, si aún no la hay, la franja ofrecida ese día.
        const av = p.availability.find((x) => x.date === key);
        const hora = p.starts_at ? p.starts_at.slice(11, 16) : av ? av.from + "–" + av.to : "";
        b.textContent = (hora ? hora + " · " : "") + CORTO[p.activity] + " · " + p.organiza;
        b.onclick = () => showPartida(p);
        cell.appendChild(b);
      });
    }
    g.appendChild(cell);
  }
}

function show(e) {
  const box = $("det");
  box.textContent = "";
  const add = (tag, cls, txt) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = txt;
    box.appendChild(el);
    return el;
  };
  add("span", "lb", e.type === "torneo" ? "Torneo" : "Quedada");
  add("h3", "", e.title).setAttribute("translate", "no");
  const f = new Date(e.starts_at).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  add("p", "", f + " · " + e.starts_at.slice(11, 16));
  if (e.location) add("p", "m", e.location).setAttribute("translate", "no");
  if (e.description) add("p", "", e.description).setAttribute("translate", "no");
  if (e.type !== "quedada") {
    if (e.capacity) add("p", "m", "Plazas: " + e.capacity);
    return;
  }
  const n = e.inscritos || 0;
  // Siempre se muestran las plazas que quedan libres.
  add("p", "m", (e.capacity
    ? (e.capacity - n > 0 ? "Plazas libres: " + (e.capacity - n) + " de " + e.capacity : "Sin plazas libres (" + n + " de " + e.capacity + " ocupadas)")
    : "Plazas libres: sin límite · " + n + (n === 1 ? " inscrito" : " inscritos")));
  if (e.en_espera) add("p", "m", "En lista de espera: " + e.en_espera);

  // Hora local del navegador con el formato de starts_at (el servidor valida con la hora de Madrid).
  const t = new Date();
  t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  if (e.starts_at <= t.toISOString().slice(0, 16)) { add("p", "m", "La inscripción está cerrada."); return; }
  if (mine === null) {
    const a = document.createElement("a");
    a.className = "btn"; a.href = "/auth/login"; a.textContent = "Entra con Discord para apuntarte";
    box.appendChild(a);
    return;
  }
  const r = mine.get(e.id);
  const err = document.createElement("div");
  err.className = "err";
  if (!r) {
    if (e.capacity && n >= e.capacity) add("p", "m", "No quedan plazas: entrarás en la lista de espera.");
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn"; b.textContent = "Apuntarme";
    b.dataset.accion = "apuntarme";
    b.onclick = () => openForm(e, box, b);
    box.append(b, err);
    return;
  }
  add("p", "ok", r.status === "inscrito" ? "Estás inscrito." : "Estás en lista de espera" + (r.posicion ? " (posición " + r.posicion + ")." : "."));
  planLines(r).forEach((t) => add("p", "m", t));
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn alt"; b.textContent = "Cancelar inscripción";
  b.onclick = () => cancel(e, b, err);
  box.append(b, err);
}

// Resumen de lo que va a hacer el usuario en la quedada.
function planLines(r) {
  const out = [];
  if (r.plan) out.push(r.plan);
  if (r.companeros && r.companeros.length) out.push("Compañero: " + r.companeros.join(", "));
  if (r.rivales && r.rivales.length) out.push((r.activity === "necromunda" ? "Participantes: " : "Rival: ") + r.rivales.join(", "));
  if (r.looking) out.push("Buscando rival.");
  if (r.inscrito_por) out.push("Te inscribió " + r.inscrito_por + ".");
  return out;
}

const ACTS = [
  ["ver", "Ir a ver"], ["pintar", "Ir a pintar"], ["combat_patrol", "Ir a jugar Combat Patrol"],
  ["40k_1000", "Ir a jugar 40k a 1K"], ["40k_2000", "Ir a jugar 40k a 2K"],
  ["necromunda", "Ir a jugar Necromunda"], ["bloodbowl", "Ir a jugar Blood Bowl"],
];
let members = null;

function mkSelect(id, opts) {
  const s = document.createElement("select");
  s.id = id;
  opts.forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    s.appendChild(o);
  });
  return s;
}

function mkField(text, control) {
  const w = document.createElement("div");
  w.className = "fld";
  const l = document.createElement("label");
  l.textContent = text;
  l.htmlFor = control.id;
  w.append(l, control);
  return w;
}

// Formulario de inscripción: qué va a hacer y, si juega, con quién.
async function openForm(e, box, startBtn) {
  startBtn.disabled = true;
  const getJson = (u) => fetch(u).then((r) => (r.ok ? r.json() : [])).catch(() => []);
  let looking;
  [members, looking] = await Promise.all([members ? members : getJson("/api/members"), getJson("/api/events/" + e.id + "/looking")]);
  startBtn.remove();
  const f = document.createElement("form");
  f.className = "fz";
  const act = mkSelect("f-act", [["", "— Elige una opción —"]].concat(ACTS));
  const fmt = mkSelect("f-fmt", [["1v1", "1vs1"], ["1v2", "1vs2"], ["2v2", "2vs2"]]);
  const side = mkSelect("f-side", [["solo", "Voy solo (contra 2)"], ["pareja", "Voy en pareja (contra 1)"]]);
  const np = mkSelect("f-np", [1, 2, 3, 4, 5, 6, 7, 8, 9].map((x) => [String(x), String(x)]));
  np.value = "2";
  const wAct = mkField("¿Qué vas a hacer?", act);
  const wFmt = mkField("Formato de la partida", fmt);
  const wSide = mkField("¿Cómo vas en el 1vs2?", side);
  const wNp = mkField("Número de participantes (contándote a ti)", np);

  const wMode = document.createElement("fieldset");
  wMode.className = "fld";
  const lg = document.createElement("legend");
  lg.textContent = "¿Tienes ya rival?";
  wMode.appendChild(lg);
  const radio = (value, text, checked) => {
    const l = document.createElement("label");
    l.className = "rad";
    const i = document.createElement("input");
    i.type = "radio"; i.name = "f-mode"; i.value = value; i.checked = checked;
    l.append(i, " " + text);
    wMode.appendChild(l);
    return i;
  };
  radio("busco", "Busco rival", true);
  const tengo = radio("tengo", "Ya tengo rival", false);

  const slots = document.createElement("div");
  const cands = document.createElement("div");
  const hint = document.createElement("p");
  hint.className = "m";
  hint.textContent = "Los jugadores que elijas quedarán inscritos en la quedada contigo. Solo aparecen los socios que han entrado alguna vez en la web.";
  const err = document.createElement("div");
  err.className = "err";
  const ok = document.createElement("button");
  ok.type = "submit"; ok.className = "btn"; ok.textContent = "Confirmar inscripción";
  const back = document.createElement("button");
  back.type = "button"; back.className = "btn alt"; back.textContent = "Volver";
  back.onclick = () => show(e);
  const acts = document.createElement("div");
  acts.className = "row";
  acts.append(ok, back);
  f.append(wAct, wFmt, wSide, wNp, wMode, cands, slots, err, acts);
  box.appendChild(f);

  // Huecos de compañeros y rivales según actividad y formato (el servidor aplica las mismas reglas).
  function counts() {
    const a = act.value;
    if (a === "combat_patrol" || a === "40k_1000") {
      if (fmt.value === "2v2") return { team: 1, rivals: 2 };
      if (fmt.value === "1v2") return side.value === "pareja" ? { team: 1, rivals: 1 } : { team: 0, rivals: 2 };
      return { team: 0, rivals: 1 };
    }
    if (a === "necromunda") return { team: 0, rivals: Number(np.value) - 1 };
    if (a === "40k_2000" || a === "bloodbowl") return { team: 0, rivals: 1 };
    return { team: 0, rivals: 0 };
  }

  function renderSlots() {
    const prev = [...slots.querySelectorAll("select")].map((s) => s.value);
    slots.textContent = "";
    if (wMode.hidden || !tengo.checked) return;
    const c = counts();
    const necro = act.value === "necromunda";
    const opts = [["", "— Sin decidir —"]].concat(members.map((x) => [x.id, x.name]));
    let k = 0;
    const add1 = (kind, i, total) => {
      const s = mkSelect("f-" + kind + i, opts);
      s.dataset.kind = kind;
      if (prev[k] && members.some((x) => x.id === prev[k])) s.value = prev[k];
      k++;
      const name = kind === "team" ? "Compañero" : necro ? "Participante" : "Rival";
      slots.appendChild(mkField(total > 1 ? name + " " + (i + 1) : name, s));
    };
    for (let i = 0; i < c.team; i++) add1("team", i, c.team);
    for (let i = 0; i < c.rivals; i++) add1("rival", i, c.rivals);
    if (!members.length) {
      const p = document.createElement("p");
      p.className = "m";
      p.textContent = "Todavía no hay otros socios registrados en la web.";
      slots.appendChild(p);
    }
    slots.appendChild(hint);
    syncPicks();
  }

  // Un jugador elegido en un hueco desaparece de los demás desplegables.
  function syncPicks() {
    const sels = [...slots.querySelectorAll("select")];
    sels.forEach((s) => {
      const taken = new Set(sels.filter((o) => o !== s && o.value).map((o) => o.value));
      [...s.options].forEach((o) => { o.hidden = o.disabled = !!o.value && taken.has(o.value); });
    });
  }
  slots.onchange = syncPicks;

  // Con «Busco rival»: gente de esta quedada que busca rival para lo mismo.
  // 40k a 1K comparte todos sus formatos; Combat Patrol, solo el mismo formato.
  function renderCands() {
    const prev = (cands.querySelector("input:checked") || {}).value || "";
    cands.textContent = "";
    if (wMode.hidden || tengo.checked) return;
    const a = act.value;
    const list = looking.filter((g) => g.activity === a && (a !== "combat_patrol" || g.format === fmt.value));
    const fs = document.createElement("fieldset");
    fs.className = "fld";
    const lg = document.createElement("legend");
    lg.textContent = list.length ? "También buscan rival" : "Ahora mismo nadie más busca rival para esto.";
    fs.appendChild(lg);
    if (list.length) {
      const opt = (value, text) => {
        const l = document.createElement("label");
        l.className = "rad";
        const i = document.createElement("input");
        i.type = "radio"; i.name = "f-join"; i.value = value; i.checked = value === prev;
        l.append(i, " " + text);
        fs.appendChild(l);
        return i;
      };
      const none = opt("", "Seguir buscando rival");
      list.forEach((g) => opt(g.join, "Jugar con " + g.names.join(" y ") + " — " + g.plan + (g.faltan > 1 ? " · faltan " + g.faltan : "")));
      if (!fs.querySelector("input:checked")) none.checked = true;
      const p = document.createElement("p");
      p.className = "m";
      p.textContent = "Si te unes a alguien, jugarás en su formato.";
      fs.appendChild(p);
    }
    cands.appendChild(fs);
  }

  function update() {
    const a = act.value;
    const play = !["", "ver", "pintar"].includes(a);
    wFmt.hidden = !(a === "combat_patrol" || a === "40k_1000");
    wSide.hidden = wFmt.hidden || fmt.value !== "1v2";
    wNp.hidden = a !== "necromunda";
    const c = counts();
    wMode.hidden = !play || c.team + c.rivals === 0;
    renderSlots();
    renderCands();
  }
  f.onchange = (x) => { if (!slots.contains(x.target) && !cands.contains(x.target)) update(); };
  update();
  act.focus();

  f.onsubmit = async (x) => {
    x.preventDefault();
    err.textContent = "";
    if (!act.value) { err.textContent = "Elige qué vas a hacer en la quedada."; return; }
    const pick = (kind) => [...slots.querySelectorAll("select")].filter((s) => s.dataset.kind === kind && s.value).map((s) => s.value);
    const teammates = pick("team"), rivals = pick("rival");
    const all = teammates.concat(rivals);
    const join = !wMode.hidden && !tengo.checked ? (cands.querySelector("input:checked") || {}).value || "" : "";
    if (!wMode.hidden && tengo.checked && !all.length) { err.textContent = "Elige al menos un jugador o marca «Busco rival»."; return; }
    if (new Set(all).size !== all.length) { err.textContent = "Has elegido al mismo jugador dos veces."; return; }
    ok.disabled = true;
    try {
      const r = await fetch("/api/events/" + e.id + "/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ activity: act.value, format: fmt.value, side: side.value, players: Number(np.value), teammates, rivals, join }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { mine = null; show(e); return; }
      if (!r.ok) { err.textContent = d.error || "No se pudo completar. Inténtalo de nuevo."; ok.disabled = false; return; }
      e.inscritos = d.inscritos;
      e.en_espera = d.en_espera;
      await reloadMine();
      show(e);
      const espera = (d.added || []).filter((p) => p.status === "espera").map((p) => p.name);
      if (espera.length) {
        const p = document.createElement("p");
        p.className = "m";
        p.textContent = "Sin plaza, en lista de espera: " + espera.join(", ") + ".";
        box.appendChild(p);
      }
    } catch (y) {
      err.textContent = "No se pudo completar. Inténtalo de nuevo.";
      ok.disabled = false;
    }
  };
}

async function cancel(e, b, err) {
  if (!confirm("¿Cancelar tu inscripción?")) return;
  b.disabled = true;
  err.textContent = "";
  try {
    const r = await fetch("/api/events/" + e.id + "/register", { method: "DELETE" });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { mine = null; show(e); return; }
    if (!r.ok) { err.textContent = d.error || "No se pudo completar. Inténtalo de nuevo."; b.disabled = false; return; }
    e.inscritos = d.inscritos;
    e.en_espera = d.en_espera;
    mine.delete(e.id);
    show(e);
  } catch (x) {
    err.textContent = "No se pudo completar. Inténtalo de nuevo.";
    b.disabled = false;
  }
}

function reloadMine() {
  return fetch("/api/my-registrations").then((r) => (r.ok ? r.json() : null)).then((d) => {
    mine = d ? new Map(d.map((x) => [x.id, x])) : null;
  }).catch(() => { mine = null; });
}

// ===== Partidas =====
let partidas = [];
const CORTO = { combat_patrol: "Combat Patrol", "40k_1000": "40k a 1K", "40k_2000": "40k a 2K", necromunda: "Necromunda", bloodbowl: "Blood Bowl" };
const JUEGOS = ACTS.filter(([v]) => v !== "ver" && v !== "pintar");

// Hora local del navegador con el formato de starts_at (el servidor valida con la hora de Madrid).
function localNow() {
  const t = new Date();
  t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  return t.toISOString().slice(0, 16);
}

function partidaTitulo(p) {
  let t = CORTO[p.activity] || p.activity;
  if (p.activity === "necromunda") t += " · " + p.players + " participantes";
  else if (p.activity === "combat_patrol" || p.activity === "40k_1000") t += " · " + p.format.replace("v", "vs");
  return t;
}

// Días en los que aparece: el fijado o, si aún no hay fecha, todos los ofrecidos.
const partidaDias = (p) => (p.starts_at ? [p.starts_at.slice(0, 10)] : p.availability.map((x) => x.date));
const partidaCerrada = (p) => (p.starts_at ? p.starts_at <= localNow() : p.last_day < localNow().slice(0, 10));
const fechaLarga = (d) => new Date(d + "T12:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

function showPartida(p) {
  const box = $("det");
  box.textContent = "";
  const add = (tag, cls, txt) => {
    const x = document.createElement(tag);
    if (cls) x.className = cls;
    x.textContent = txt;
    box.appendChild(x);
    return x;
  };
  add("span", "lb", "Partida");
  add("h3", "", partidaTitulo(p));
  add("p", "m", "Organiza: " + p.organiza);
  if (p.starts_at) add("p", "", fechaLarga(p.starts_at.slice(0, 10)) + " · " + p.starts_at.slice(11, 16));
  else {
    add("p", "", "Puede jugar:");
    const ul = document.createElement("ul");
    ul.className = "disp";
    p.availability.forEach((x) => {
      const li = document.createElement("li");
      li.textContent = fechaLarga(x.date) + " · de " + x.from + " a " + x.to;
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  // Jugadores por bando, con los huecos libres.
  const names = (side, total) => {
    const xs = p.jugadores.filter((j) => j.side === side).map((j) => j.name + (j.yo ? " (tú)" : ""));
    while (xs.length < total) xs.push("hueco libre");
    return xs;
  };
  if (p.activity === "necromunda") add("p", "", "Participantes: " + names("A", p.team_a).concat(names("B", p.team_b)).join(", "));
  else add("p", "", names("A", p.team_a).join(" y ") + " contra " + names("B", p.team_b).join(" y "));

  const cerrada = partidaCerrada(p);
  if (p.status === "completa") add("p", "ok", "Completa · " + (p.mesa ? "Mesa " + p.mesa : "sin mesa libre: avisa a un admin"));
  else if (!cerrada) add("p", "m", "Abierta · falta" + (p.faltan > 1 ? "n " : " ") + p.faltan + " jugador" + (p.faltan > 1 ? "es" : ""));
  if (cerrada) { add("p", "m", "La partida está cerrada."); return; }

  const err = document.createElement("div");
  err.className = "err";
  const act = async (method, url, body, confirmTxt) => {
    if (confirmTxt && !confirm(confirmTxt)) return;
    err.textContent = "";
    box.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    try {
      const r = await fetch(url, {
        method,
        headers: body ? { "content-type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.textContent = d.error || "No se pudo completar. Inténtalo de nuevo.";
        box.querySelectorAll("button").forEach((x) => { x.disabled = false; });
        if (r.status === 404) { await loadPartidas(); render(); }
        return;
      }
      if (d.id) { partidas = partidas.map((x) => (x.id === d.id ? d : x)); render(); showPartida(d); }
      else { partidas = partidas.filter((x) => x.id !== p.id); render(); $("det").textContent = "Partida retirada."; }
    } catch (x) {
      err.textContent = "No se pudo completar. Inténtalo de nuevo.";
      box.querySelectorAll("button").forEach((y) => { y.disabled = false; });
    }
  };
  const btn = (txt, cls, fn) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = cls; b.textContent = txt; b.onclick = fn;
    box.appendChild(b);
    return b;
  };

  if (p.mia) btn("Retirar partida", "btn alt", () => act("DELETE", "/api/partidas/" + p.id, null, "¿Retirar esta partida? Desaparecerá del calendario para todos."));
  else if (p.dentro) btn("Salir de la partida", "btn alt", () => act("DELETE", "/api/partidas/" + p.id + "/join", null, "¿Salir de esta partida?"));
  else if (p.status === "abierta") {
    let slot = null;
    if (!p.starts_at) {
      // Elegir día y hora de entre los ofrecidos (solo los que aún no han pasado).
      const now = localNow();
      const opciones = [];
      p.availability.forEach((x) => {
        for (let h = +x.from.slice(0, 2); h < +x.to.slice(0, 2); h++) {
          const v = x.date + "T" + String(h).padStart(2, "0") + ":00";
          if (v > now) opciones.push(v);
        }
      });
      if (!opciones.length) { add("p", "m", "Ya no quedan horas disponibles."); return; }
      const dias = [...new Set(opciones.map((v) => v.slice(0, 10)))];
      const dSel = mkSelect("pj-dia", dias.map((d) => [d, fechaLarga(d)]));
      const hSel = mkSelect("pj-hora", []);
      const fillH = () => {
        hSel.textContent = "";
        opciones.filter((v) => v.startsWith(dSel.value)).forEach((v) => {
          const o = document.createElement("option");
          o.value = v; o.textContent = v.slice(11);
          hSel.appendChild(o);
        });
      };
      dSel.onchange = fillH;
      fillH();
      box.append(mkField("Día", dSel), mkField("Hora de inicio", hSel));
      slot = () => hSel.value;
    }
    // Elegir bando si hay hueco en los dos (no en Necromunda).
    let side = null;
    const libres = (sd) => (sd === "A" ? p.team_a : p.team_b) - p.jugadores.filter((j) => j.side === sd).length;
    if (p.activity !== "necromunda" && libres("A") > 0 && libres("B") > 0) {
      const de = (sd) => p.jugadores.filter((j) => j.side === sd).map((j) => j.name).join(" y ");
      const fs = document.createElement("fieldset");
      fs.className = "fld";
      const lg = document.createElement("legend");
      lg.textContent = "¿En qué bando?";
      fs.appendChild(lg);
      [["B", "Contra " + de("A") + (de("B") ? " (con " + de("B") + ")" : "")], ["A", "En el equipo de " + de("A")]].forEach(([v, txt], i) => {
        const l = document.createElement("label");
        l.className = "rad";
        const r = document.createElement("input");
        r.type = "radio"; r.name = "pj-side"; r.value = v; r.checked = i === 0;
        l.append(r, " " + txt);
        fs.appendChild(l);
      });
      box.appendChild(fs);
      side = () => (fs.querySelector("input:checked") || {}).value;
    }
    btn("Unirme", "btn", () => act("POST", "/api/partidas/" + p.id + "/join", { slot: slot ? slot() : null, side: side ? side() : null }));
  } else add("p", "m", "No se admiten más jugadores salvo que alguien se caiga.");
  box.appendChild(err);
}

// Formulario "Buscar partida": modalidad y disponibilidad en los próximos 7 días.
function openPartidaForm() {
  const box = $("det");
  box.textContent = "";
  const lb = document.createElement("span");
  lb.className = "lb"; lb.textContent = "Buscar partida";
  const h = document.createElement("h3");
  h.textContent = "¿A qué quieres jugar?";
  box.append(lb, h);

  const f = document.createElement("form");
  f.className = "fz";
  const act = mkSelect("bp-act", [["", "— Elige una modalidad —"]].concat(JUEGOS));
  const fmt = mkSelect("bp-fmt", [["1v1", "1vs1"], ["1v2", "1vs2"], ["2v2", "2vs2"]]);
  const side = mkSelect("bp-side", [["solo", "Voy solo (contra 2)"], ["pareja", "Voy en pareja (contra 1)"]]);
  const np = mkSelect("bp-np", [2, 3, 4, 5, 6, 7, 8, 9].map((x) => [String(x), String(x)]));
  const wFmt = mkField("Formato de la partida", fmt);
  const wSide = mkField("¿Cómo vas en el 1vs2?", side);
  const wNp = mkField("Número de participantes (contándote a ti)", np);

  // Hoy y los 6 días siguientes, cada uno con su franja horaria.
  const days = document.createElement("fieldset");
  days.className = "fld";
  const lg = document.createElement("legend");
  lg.textContent = "¿Cuándo puedes en los próximos 7 días?";
  days.appendChild(lg);
  const hrs = (a, b) => { const o = []; for (let i = a; i <= b; i++) { const v = String(i).padStart(2, "0") + ":00"; o.push([v, v]); } return o; };
  const t = new Date();
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
    const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const r = document.createElement("div");
    r.className = "dia";
    const l = document.createElement("label");
    l.className = "rad";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    l.append(cb, " " + d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric" }));
    const from = mkSelect("bp-from-" + i, hrs(8, 22));
    const to = mkSelect("bp-to-" + i, hrs(9, 23));
    from.value = "20:00"; to.value = "23:00";
    from.setAttribute("aria-label", "Desde"); to.setAttribute("aria-label", "Hasta");
    const span = document.createElement("span");
    span.className = "hh";
    span.append(from, " a ", to);
    const sync = () => { from.disabled = to.disabled = !cb.checked; };
    cb.onchange = sync;
    sync();
    r.append(l, span);
    days.appendChild(r);
    rows.push({ iso, cb, from, to });
  }

  const err = document.createElement("div");
  err.className = "err";
  const ok = document.createElement("button");
  ok.type = "submit"; ok.className = "btn"; ok.textContent = "Publicar partida";
  const back = document.createElement("button");
  back.type = "button"; back.className = "btn alt"; back.textContent = "Volver";
  back.onclick = () => { $("det").textContent = "Selecciona un evento del calendario."; };
  const acts = document.createElement("div");
  acts.className = "row";
  acts.append(ok, back);
  const nota = document.createElement("p");
  nota.className = "m";
  nota.textContent = "Se publica una partida independiente por cada día que marques, cada una con sus propios rivales.";
  days.appendChild(nota);
  f.append(mkField("Modalidad", act), wFmt, wSide, wNp, days, err, acts);
  box.appendChild(f);

  const update = () => {
    const a = act.value;
    wFmt.hidden = !(a === "combat_patrol" || a === "40k_1000");
    wSide.hidden = wFmt.hidden || fmt.value !== "1v2";
    wNp.hidden = a !== "necromunda";
  };
  act.onchange = fmt.onchange = update;
  update();
  act.focus();

  f.onsubmit = async (x) => {
    x.preventDefault();
    err.textContent = "";
    if (!act.value) { err.textContent = "Elige una modalidad."; return; }
    const availability = rows.filter((r) => r.cb.checked).map((r) => ({ date: r.iso, from: r.from.value, to: r.to.value }));
    if (!availability.length) { err.textContent = "Marca al menos un día."; return; }
    if (availability.some((r) => r.from >= r.to)) { err.textContent = "En cada día, la hora de fin debe ser posterior a la de inicio."; return; }
    ok.disabled = true;
    try {
      const r = await fetch("/api/partidas", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ activity: act.value, format: fmt.value, side: side.value, players: Number(np.value), availability }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = d.error || "No se pudo publicar. Inténtalo de nuevo."; ok.disabled = false; return; }
      partidas.push(...d);
      const first = partidaDias(d[0])[0];
      y = +first.slice(0, 4); m = +first.slice(5, 7) - 1;
      render();
      showPartida(d[0]);
      if (d.length > 1) {
        const n = document.createElement("p");
        n.className = "ok";
        n.textContent = "Se han publicado " + d.length + " partidas, una por cada día.";
        $("det").insertBefore(n, $("det").children[1]);
      }
    } catch (y2) {
      err.textContent = "No se pudo publicar. Inténtalo de nuevo.";
      ok.disabled = false;
    }
  };
}

// Sección «Borrar» (icono de papelera): borrar en bloque mis partidas de esta semana.
function openGestion() {
  const w = $("det");
  w.textContent = "";
  const mias = partidas.filter((p) => p.mia && !partidaCerrada(p));
  const vacias = mias.filter((p) => p.jugadores.length <= 1);
  const h = document.createElement("span");
  h.className = "lb";
  h.textContent = "Borrar partidas";
  const t = document.createElement("h3");
  t.textContent = "Mis partidas de esta semana";
  w.append(h, t);
  const info = document.createElement("p");
  info.className = "m";
  info.textContent = mias.length
    ? mias.length + (mias.length === 1 ? " publicada, " : " publicadas, ") + vacias.length + " sin rivales todavía."
    : "No tienes partidas publicadas.";
  w.append(info);
  if (!mias.length) return;
  const err = document.createElement("div");
  err.className = "err";
  const borrar = async (soloVacias, b) => {
    const n = soloVacias ? vacias.length : mias.length;
    const q = soloVacias
      ? "¿Borrar tus " + n + " partidas sin rivales?"
      : "¿Borrar todas tus partidas (" + n + ")? Las que ya tienen rivales también desaparecerán.";
    if (!confirm(q)) return;
    b.disabled = true;
    err.textContent = "";
    try {
      const r = await fetch("/api/partidas" + (soloVacias ? "?solo=vacias" : ""), { method: "DELETE" });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = d.error || "No se pudo borrar."; b.disabled = false; return; }
      await loadPartidas();
      render();
      openGestion();
      const ok = document.createElement("p");
      ok.className = "ok";
      ok.textContent = d.borradas === 1 ? "Se ha borrado 1 partida." : "Se han borrado " + d.borradas + " partidas.";
      $("det").appendChild(ok);
    } catch (x) { err.textContent = "No se pudo borrar."; b.disabled = false; }
  };
  const mk = (txt, solo, disabled) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn alt"; b.textContent = txt; b.disabled = disabled;
    b.onclick = () => borrar(solo, b);
    return b;
  };
  const row = document.createElement("div");
  row.className = "row";
  row.append(mk("Borrar mis partidas vacías (" + vacias.length + ")", true, !vacias.length), mk("Borrar todas (" + mias.length + ")", false, false));
  w.append(row, err);
}

function loadPartidas() {
  return fetch("/api/partidas").then((r) => (r.ok ? r.json() : [])).then((d) => { partidas = d; }).catch(() => { partidas = []; });
}

$("chips").onclick = (x) => {
  const f = x.target.dataset.f;
  if (!f) return;
  filtro = f;
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === x.target));
  $("fm").hidden = f !== "partida";
  render();
};
$("fm").onchange = render;
$("prev").onclick = () => { m--; if (m < 0) { m = 11; y--; } render(); };
$("next").onclick = () => { m++; if (m > 11) { m = 0; y++; } render(); };

$("bp").onclick = openPartidaForm;
$("bdel").onclick = openGestion;

Promise.all([fetch("/api/events").then((r) => r.json()), reloadMine().then(() => (mine ? loadPartidas() : null))]).then(([d]) => {
  if (mine) $("bp").hidden = $("bdel").hidden = $("chp").hidden = false;
  else $("bpl").hidden = false; // sin sesión: invitación a entrar para buscar partida
  ev = d;
  const now = new Date().toISOString().slice(0, 16);
  const next = ev.find((e) => e.starts_at >= now);
  if (next) { y = +next.starts_at.slice(0, 4); m = +next.starts_at.slice(5, 7) - 1; }
  render();
  abrirDesdeEnlace();
}).catch(() => render());

// Enlaces directos desde Inicio: ?evento=ID (y &apuntarme=1 para abrir el formulario) o ?partida=ID.
function abrirDesdeEnlace() {
  const q = new URLSearchParams(location.search);
  const irA = (fecha) => { y = +fecha.slice(0, 4); m = +fecha.slice(5, 7) - 1; render(); };
  const e = ev.find((x) => String(x.id) === q.get("evento"));
  if (e) {
    irA(e.starts_at);
    show(e);
    const b = $("det").querySelector('[data-accion="apuntarme"]');
    if (q.get("apuntarme") === "1" && b) b.click();
  }
  const p = partidas.find((x) => String(x.id) === q.get("partida"));
  if (p) { irA(partidaDias(p)[0]); showPartida(p); }
  if (q.get("buscar") === "1" && mine) openPartidaForm();
  if (e || p) $("det").scrollIntoView({ block: "nearest" });
}
render();
