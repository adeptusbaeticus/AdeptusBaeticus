[hidden]{display:none!important}
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:#D9B25A}
.c{max-width:1120px;margin:0 auto;padding:0 32px 64px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
/* La cabecera se queda fija arriba al hacer scroll. */
.nav{position:sticky;top:0;z-index:40;background:#15171A}
html{scroll-padding-top:96px}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.lg{height:44px;width:auto;border-radius:6px;display:block}
.menu{display:flex;gap:24px;flex-wrap:wrap}
.menu a{color:#ECE7DC;text-decoration:none;font-weight:500;padding:8px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.on{border-color:#D9B25A}
h1{font:700 40px/1.1 Cinzel,Georgia,serif;margin:40px 0 8px}
.lead{color:#CFC9BA;margin:0 0 32px;max-width:640px}
.lead code{background:#1F2328;border:1px solid #2C3036;border-radius:6px;padding:1px 6px;font-size:14px}
.m{color:#A8A293;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.post{background:#1F2328;border:1px solid #2C3036;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.post .foto{position:relative;display:block;border:0;padding:0;background:#2A2F36;cursor:zoom-in;aspect-ratio:1/1;width:100%}
.post .n{position:absolute;top:8px;right:8px;background:rgba(21,23,26,.85);color:#ECE7DC;border-radius:999px;padding:2px 10px;font:600 13px Inter,sans-serif}
.post img{width:100%;height:100%;object-fit:cover;display:block}
.post .tx{padding:16px}
.post p{margin:0 0 8px;white-space:pre-line;overflow-wrap:anywhere}
.post .who{display:flex;justify-content:space-between;gap:8px;color:#A8A293;font-size:13px}
.post .pie{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.bless{display:inline-flex;align-items:center;gap:6px;background:#15171A;color:#ECE7DC;border:1px solid #6B6558;border-radius:999px;padding:4px 12px;min-height:36px;font:600 14px Inter,sans-serif;cursor:pointer}
.bless svg{display:block}
.bless.emp svg{color:#D9B25A}.bless.rui svg{color:#E0524A}
.bless.emp.on{background:#D9B25A;color:#15171A;border-color:#D9B25A}.bless.emp.on svg{color:#15171A}
.bless.rui.on{background:#A3211B;color:#fff;border-color:#A3211B}.bless.rui.on svg{color:#fff}
.bless:disabled{cursor:default;opacity:.75}
.bl{display:flex;gap:8px;flex-wrap:wrap}
.fil{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 24px}
.fil label{display:block;font-weight:600;font-size:13px;color:#A8A293;margin-bottom:4px}
.fil select{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid #6B6558;background:#1F2328;color:#ECE7DC;font:inherit;min-width:220px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:50;gap:12px}
.ov img{max-width:100%;max-height:74vh;border-radius:8px}
.ov .nav2{display:flex;align-items:center;gap:12px}
.ov .cnt{color:#A8A293;font-size:14px;min-width:60px;text-align:center}
.ov p{max-width:720px;margin:0;color:#ECE7DC;text-align:center;white-space:pre-line}
.ov button{background:#1F2328;color:#ECE7DC;border:1px solid #6B6558;border-radius:8px;padding:10px 18px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:44px}
@media (max-width:600px){.c{padding:0 16px 48px}h1{font-size:32px}}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin:0 0 24px}
.cab .lead{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#A3211B;color:#fff;border:1px solid #A3211B;border-radius:8px;padding:10px 18px;min-height:44px;box-sizing:border-box;font:600 15px Inter,sans-serif;cursor:pointer}
.btn:hover{background:#B8291F}.btn:disabled{opacity:.6;cursor:default}
.btn.alt{background:#1F2328;color:#ECE7DC;border-color:#6B6558}
.post .borrar{background:none;border:0;color:#F0A39E;font:600 13px Inter,sans-serif;cursor:pointer;min-height:36px;padding:0 4px}
.post .pie .der{display:flex;align-items:center;gap:6px}

dialog#dsub::backdrop{background:rgba(0,0,0,.75)}

#dsub .resumen{flex-basis:100%;padding:10px 12px;border-radius:8px;background:#2A1A1C;border:1px solid #7A1712;color:#F0A39E;font-size:14px}
#dsub .resumen ul{margin:4px 0 0;padding-left:18px}
#dsub .estado{flex-basis:100%;font-size:14px;color:#CFC9BA;min-height:20px}
#dsub label.t{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
#dsub textarea{width:100%;box-sizing:border-box;min-height:80px;padding:10px 12px;border-radius:8px;border:1px solid #6B6558;background:#15171A;color:#ECE7DC;font:inherit;resize:vertical}
#dsub .elegir{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #6B6558;border-radius:12px;min-height:72px;padding:12px;cursor:pointer;color:#CFC9BA;text-align:center}
#dsub .elegir:hover,#dsub .elegir:focus-within{border-color:#D9B25A;color:#F0CE82}
#dsub .elegir input{position:absolute;opacity:0;width:1px;height:1px}
#dsub .miniaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
#dsub .mini{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#2A2F36}
#dsub .mini img{width:100%;height:100%;object-fit:cover;display:block}
#dsub .mini button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(21,23,26,.85);color:#F0A39E;font-size:16px;cursor:pointer}
#dsub .mini .num{position:absolute;bottom:4px;left:6px;font:700 12px Inter,sans-serif;color:#fff;text-shadow:0 1px 3px #000}
#dsub .ay{font-size:13px;color:#A8A293;margin:6px 0 0}

.post.nueva{outline:3px solid #D9B25A;outline-offset:2px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:32px;color:#A8A293;font-size:14px}

.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}

/* Transición entre páginas: la cabecera y el pie se quedan quietos; cambia el contenido. */
@view-transition{navigation:auto}
.nav{view-transition-name:cabecera}
.ft{view-transition-name:pie}
::view-transition-old(cabecera),::view-transition-new(cabecera){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}

<script>
const $ = (id) => document.getElementById(id);

function el(tag, cls, txt) {
  const x = document.createElement(tag);
  if (cls) x.className = cls;
  if (txt != null) x.textContent = txt;
  return x;
}

const fecha = (s) => new Date(s.replace(" ", "T") + "Z").toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });

// Vista ampliada de una publicación; con varias fotos se pasan con flechas (o con el teclado).
function ampliar(p, start) {
  let i = start || 0;
  const n = p.imagenes.length;
  const ov = el("div", "ov");
  ov.setAttribute("role", "dialog");
  ov.setAttribute("aria-modal", "true");
  const im = el("img");
  const cnt = el("span", "cnt");
  const show = () => {
    im.src = p.imagenes[i].url;
    im.alt = (p.texto || "Foto de " + p.autor) + (n > 1 ? " (" + (i + 1) + " de " + n + ")" : "");
    cnt.textContent = (i + 1) + " / " + n;
  };
  const go = (d) => { i = (i + d + n) % n; show(); };
  const cap = el("p", "", (p.texto ? p.texto + "\n" : "") + p.autor + " · " + fecha(p.created_at));
  const close = el("button", "", "Cerrar");
  const fin = () => { ov.remove(); document.removeEventListener("keydown", key); };
  const key = (e) => {
    if (e.key === "Escape") fin();
    else if (n > 1 && e.key === "ArrowLeft") go(-1);
    else if (n > 1 && e.key === "ArrowRight") go(1);
  };
  close.onclick = fin;
  ov.onclick = (e) => { if (e.target === ov) fin(); };
  document.addEventListener("keydown", key);
  ov.append(im);
  if (n > 1) {
    const prev = el("button", "", "‹ Anterior");
    const next = el("button", "", "Siguiente ›");
    prev.onclick = () => go(-1);
    next.onclick = () => go(1);
    const nav = el("div", "nav2");
    nav.append(prev, cnt, next);
    ov.appendChild(nav);
  }
  ov.append(cap, close);
  show();
  document.body.appendChild(ov);
  close.focus();
}

const BENDICION = {
  emperador: { cls: "emp", dar: "Dar la bendición del Emperador", quitar: "Retirar tu bendición del Emperador", nombre: "del Emperador" },
  ruinosos: { cls: "rui", dar: "Dar la bendición de los Poderes Ruinosos", quitar: "Retirar tu bendición de los Poderes Ruinosos", nombre: "de los Poderes Ruinosos" },
};

function icono(tipo) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  const ic = ICONOS[tipo];
  svg.setAttribute("viewBox", "0 0 " + ic.w + " " + ic.h);
  svg.setAttribute("height", ic.alto);
  svg.setAttribute("width", Math.round((ic.alto * ic.w) / ic.h));
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", ic.d);
  path.setAttribute("fill", "currentColor");
  path.setAttribute("fill-rule", "evenodd");
  svg.appendChild(path);
  return svg;
}

// Botón de bendición de un tipo (una de cada tipo por socio y publicación).
function bendicion(p, tipo, sesion) {
  const B = BENDICION[tipo];
  const b = el("button", "bless " + B.cls);
  b.type = "button";
  const pinta = () => {
    const n = p[tipo], mia = p.mias[tipo];
    b.textContent = "";
    b.classList.toggle("on", mia);
    b.append(icono(tipo), el("span", "", String(n)));
    b.title = !sesion ? "Entra con Discord para dar tu bendición" : mia ? B.quitar : B.dar;
    b.setAttribute("aria-label", n + (n === 1 ? " bendición " : " bendiciones ") + B.nombre + ". " + b.title);
    b.setAttribute("aria-pressed", mia ? "true" : "false");
  };
  pinta();
  if (!sesion) { b.disabled = true; return b; }
  b.onclick = async () => {
    b.disabled = true;
    try {
      const r = await fetch("/api/galeria/" + p.id + "/bendicion?tipo=" + tipo, { method: p.mias[tipo] ? "DELETE" : "POST" });
      if (r.ok) {
        const d = await r.json();
        p.emperador = d.emperador; p.ruinosos = d.ruinosos; p.mias = d.mias;
        pinta(); // no se reordena al momento para no mover la tarjeta bajo el dedo
      }
    } catch (e) {}
    b.disabled = false;
  };
  return b;
}

function tarjeta(p) {
  const card = el("article", "post");
  card.id = "p" + p.numero;
  const b = el("button", "foto");
  b.type = "button";
  const portada = p.imagenes[0] || {};
  const n = p.imagenes.length;
  b.setAttribute("aria-label", "Ampliar publicación " + p.numero + (n > 1 ? " (" + n + " fotos)" : ""));
  const im = el("img");
  im.src = portada.url;
  im.alt = p.texto || "Foto de " + p.autor;
  im.loading = "lazy";
  if (portada.width && portada.height) { im.width = portada.width; im.height = portada.height; }
  b.appendChild(im);
  if (n > 1) b.appendChild(el("span", "n", "1/" + n));
  b.onclick = () => ampliar(p);
  const tx = el("div", "tx");
  if (p.texto) { const t = el("p", "", p.texto); t.setAttribute("translate", "no"); tx.appendChild(t); }
  const who = el("div", "who");
  who.append(el("span", "", p.autor), el("span", "", fecha(p.created_at)));
  tx.appendChild(who);
  const pie = el("div", "pie");
  const bl = el("div", "bl");
  bl.append(bendicion(p, "emperador", data.sesion), bendicion(p, "ruinosos", data.sesion));
  const der = el("div", "der");
  if (p.puedo_borrar) {
    const bo = el("button", "borrar", "Borrar");
    bo.type = "button";
    bo.onclick = async () => {
      if (!confirm("¿Borrar la publicación #" + p.numero + "? También se borrará su mensaje en Discord.")) return;
      bo.disabled = true;
      try {
        const r = await fetch("/api/galeria/" + p.id, { method: "DELETE" });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { alert(d.error || "No se pudo borrar."); bo.disabled = false; return; }
        await cargar();
      } catch (e) { alert("No se pudo borrar."); bo.disabled = false; }
    };
    der.appendChild(bo);
  }
  der.appendChild(el("span", "m", "#" + p.numero));
  pie.append(bl, der);
  tx.appendChild(pie);
  card.append(b, tx);
  return card;
}

let data = { sesion: false, publicaciones: [] };

// Pinta la cuadrícula según el orden y el miembro elegidos.
function pintar() {
  const orden = $("orden").value, autor = $("autor").value;
  let list = data.publicaciones.filter((p) => !autor || p.autor === autor);
  if (orden !== "recientes") list = list.slice().sort((a, b) => b[orden] - a[orden] || b.numero - a.numero);
  const g = $("grid");
  g.textContent = "";
  $("msg").hidden = !!list.length;
  $("msg").textContent = list.length ? "" : autor ? "Este miembro aún no ha publicado fotos." : "Todavía no hay fotos publicadas.";
  list.forEach((p) => g.appendChild(tarjeta(p)));
}

$("orden").onchange = pintar;
$("autor").onchange = pintar;

// Carga (o recarga) la galería; resalta la publicación «nueva» si se indica su número.
function cargar(nueva) {
  return fetch("/api/galeria", { cache: "no-store" }).then((r) => (r.ok ? r.json() : Promise.reject())).then((d) => {
    data = d;
    data.publicaciones = (d.publicaciones || []).filter((p) => p.imagenes && p.imagenes.length);
    const sel = $("autor"), antes = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    const autores = [...new Set(data.publicaciones.map((p) => p.autor))].sort((a, b) => a.localeCompare(b, "es"));
    autores.forEach((a) => {
      const o = document.createElement("option");
      o.value = a; o.textContent = a; o.setAttribute("translate", "no");
      sel.appendChild(o);
    });
    sel.value = autores.includes(antes) ? antes : "";
    $("fil").hidden = !data.publicaciones.length;
    $("bsubir").hidden = !d.puede_subir;
    pintar();
    if (nueva) {
      const c = $("p" + nueva);
      if (c) { c.classList.add("nueva"); c.scrollIntoView({ block: "center" }); setTimeout(() => c.classList.remove("nueva"), 4000); }
    }
  }).catch(() => { $("msg").textContent = "No se pudo cargar la galería."; });
}
cargar();

// ===== Subir fotos desde la web (solo miembros) =====
const MAX_FOTOS = 10;
// Reduce la foto en el navegador (lado mayor 2000 px, JPEG) para que la subida sea ligera.
// Los GIF se envían tal cual para no perder la animación.
async function preparaFoto(file) {
  if (file.type === "image/gif") return { blob: file, nombre: "foto.gif" };
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  if (!bmp) return null;
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.86, blob = null;
  for (let i = 0; i < 4; i++) {
    blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", q));
    if (blob && blob.size < 2.5 * 1024 * 1024) break;
    q -= 0.12;
  }
  return blob ? { blob, nombre: "foto.jpg" } : null;
}

function formularioSubir() {
  const dlg = $("dsub");
  const c = $("dsubc");
  c.textContent = "";
  let fotos = []; // { file, url }
  const h2 = el("h2", "", "Subir fotos"); h2.id = "dsub-t"; c.appendChild(h2);
  const arriba = el("div", "arriba");
  const ok = el("button", "btn", "Publicar"); ok.type = "button";
  const no = el("button", "btn alt", "Cancelar"); no.type = "button";
  const avisos = el("div"); avisos.setAttribute("role", "alert");
  const estado = el("div", "estado"); estado.setAttribute("aria-live", "polite");
  arriba.append(ok, no, avisos, estado);
  c.appendChild(arriba);
  // Elegir fotos
  const lf = el("label", "t", "Fotos (hasta 10)");
  lf.htmlFor = "dsub-fotos";
  const elegir = el("label", "elegir");
  const inp = el("input"); inp.type = "file"; inp.id = "dsub-fotos"; inp.multiple = true; inp.accept = "image/png,image/jpeg,image/gif,image/webp";
  elegir.append(inp, el("span", "", "Pulsa para elegir fotos"));
  const minis = el("div", "miniaturas");
  const cuenta = el("p", "ay", "");
  const pintaMinis = () => {
    minis.textContent = "";
    fotos.forEach((f, i) => {
      const m = el("div", "mini");
      const im = el("img"); im.src = f.url; im.alt = "";
      const q = el("button", "", "×"); q.type = "button"; q.setAttribute("aria-label", "Quitar foto " + (i + 1));
      q.onclick = () => { URL.revokeObjectURL(f.url); fotos.splice(i, 1); pintaMinis(); };
      m.append(im, el("span", "num", String(i + 1)), q);
      minis.appendChild(m);
    });
    cuenta.textContent = fotos.length ? (fotos.length === 1 ? "1 foto elegida" : fotos.length + " fotos elegidas") + " de " + MAX_FOTOS + " como máximo." : "";
    elegir.hidden = fotos.length >= MAX_FOTOS;
  };
  inp.onchange = () => {
    const nuevas = [...inp.files].filter((f) => /^image\/(png|jpeg|gif|webp)$/.test(f.type));
    const sobra = fotos.length + nuevas.length - MAX_FOTOS;
    nuevas.slice(0, MAX_FOTOS - fotos.length).forEach((f) => fotos.push({ file: f, url: URL.createObjectURL(f) }));
    inp.value = "";
    avisos.textContent = "";
    elegir.classList.remove("inval");
    pintaMinis();
    if (sobra > 0) estado.textContent = "Solo se pueden subir 10 fotos por publicación; las demás no se han añadido.";
  };
  const lt = el("label", "t", "Descripción (opcional)"); lt.htmlFor = "dsub-texto";
  const tx = el("textarea"); tx.id = "dsub-texto"; tx.maxLength = 500; tx.placeholder = "Por ejemplo: mis Marines Espaciales recién pintados";
  c.append(lf, elegir, minis, cuenta, lt, tx, el("p", "ay", "Se publicará también en el canal #publicaciones-web de Discord. Si la borras, se borra de los dos sitios."));
  pintaMinis();

  let subiendo = false;
  no.onclick = () => { if (!subiendo) dlg.close(); };
  dlg.oncancel = (e) => { if (subiendo) e.preventDefault(); };
  ok.onclick = async () => {
    avisos.textContent = ""; estado.textContent = "";
    if (!fotos.length) {
      const r = el("div", "resumen", "Falta un dato:");
      const ul = el("ul"); ul.appendChild(el("li", "", "Elige al menos una foto."));
      r.appendChild(ul); avisos.appendChild(r);
      elegir.classList.add("inval");
      return;
    }
    subiendo = true; ok.disabled = true; no.disabled = true;
    let id = null, numero = null, subidas = 0, error = null;
    for (let i = 0; i < fotos.length; i++) {
      estado.textContent = "Subiendo foto " + (i + 1) + " de " + fotos.length + "…";
      const pf = await preparaFoto(fotos[i].file).catch(() => null);
      if (!pf) { error = "No se pudo leer la foto " + (i + 1) + "."; break; }
      const fd = new FormData();
      fd.append("foto", pf.blob, pf.nombre);
      if (!id) fd.append("texto", tx.value);
      try {
        const r = await fetch(id ? "/api/galeria/" + id + "/foto" : "/api/galeria/publicar", { method: "POST", body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { error = d.error || "No se pudo subir la foto " + (i + 1) + "."; break; }
        if (!id) { id = d.id; numero = d.numero; }
        subidas++;
      } catch (e) { error = "No se pudo subir la foto " + (i + 1) + ". Revisa la conexión."; break; }
    }
    if (id) {
      const f = await fetch("/api/galeria/" + id + "/fin", { method: "POST" }).then((r) => r.json()).catch(() => ({}));
      if (f.numero) numero = f.numero;
    }
    subiendo = false; ok.disabled = false; no.disabled = false;
    if (error && !id) { estado.textContent = error; return; }
    fotos.forEach((f) => URL.revokeObjectURL(f.url));
    dlg.close();
    await cargar(numero);
    if (error) alert("Publicación #" + numero + ": se han subido " + subidas + " de " + fotos.length + " fotos. " + error);
  };
  dlg.showModal();
}
$("bsubir").onclick = formularioSubir;
</script>
<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
