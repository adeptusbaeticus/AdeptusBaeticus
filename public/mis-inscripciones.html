<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis inscripciones · Adeptus Baeticus</title>
<link rel="icon" href="/Final_General.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0;background:#15171A;color:#ECE7DC;font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:#D9B25A}
.c{max-width:1120px;margin:0 auto;padding:0 32px 64px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #2C3036}
/* La cabecera se queda fija arriba al hacer scroll. */
.nav{position:sticky;top:0;z-index:40;background:#15171A}
html{scroll-padding-top:96px}
.brand{display:flex;align-items:center;gap:12px;font:700 20px Cinzel,Georgia,serif;color:#ECE7DC;text-decoration:none;letter-spacing:.06em}
.lg{height:44px;width:auto;border-radius:6px;display:block}
.menu{display:flex;gap:24px;flex-wrap:wrap}
.menu a{color:#ECE7DC;text-decoration:none;font-weight:500;padding:8px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.on{border-color:#D9B25A}
h1{font:700 40px/1.1 Cinzel,Georgia,serif;margin:40px 0 24px}
h2{font:700 24px Cinzel,Georgia,serif;margin:32px 0 16px}
.card{background:#1F2328;border:1px solid #2C3036;border-radius:12px;padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.m{color:#A8A293;font-size:14px}
.st{font-weight:600}
.st.ok{color:#9FD39B}.st.w{color:#D9B25A}.st.x{color:#F0A39E}
.chip{background:#1F2328;color:#ECE7DC;border:1px solid #6B6558;border-radius:999px;padding:8px 16px;min-height:44px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip:disabled{opacity:.6;cursor:default}
.btn{display:inline-block;background:#A3211B;color:#fff;border-radius:8px;padding:12px 20px;font:600 15px Inter,sans-serif;text-decoration:none}
.err{color:#F0A39E;font-size:14px}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2C3036;padding:24px 0 40px;margin-top:32px;color:#A8A293;font-size:14px}
.ftl{display:flex;gap:20px;flex-wrap:wrap}
.ftl a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#D9B25A;font-weight:500;text-decoration:none}
.ftl a:hover{color:#F0CE82;text-decoration:underline}
/* Transición entre páginas: la cabecera y el pie se quedan quietos; cambia el contenido. */
@view-transition{navigation:auto}
.nav{view-transition-name:cabecera}
.ft{view-transition-name:pie}
::view-transition-old(cabecera),::view-transition-new(cabecera){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}
@media (max-width:600px){.menu{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:2px 18px}.menu a{font-size:14px;padding:6px 0}}
@media (max-width:600px){.c{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="c">
  <div class="nav">
    <a class="brand" href="/"><img class="lg" src="/Final_General.png" alt="">Adeptus Baeticus</a>
    <nav class="menu"><a href="/">Inicio</a><a href="/calendario.html">Calendario</a><a href="/galeria.html">Galería</a><a href="/gran-liga.html">Gran Liga</a><a href="/miembros.html">Miembros</a><a href="/faq.html">Reglas y FAQ</a></nav>
    <span id="auth"></span>
  </div>
  <h1>Mis inscripciones</h1>
  <p id="msg" class="m">Cargando...</p>
  <div id="prox"></div>
  <div id="pas"></div>
  <div id="parts"></div>
  <footer class="ft">
    <span>Adeptus Baeticus · <a class="hecho" style="color:#D9B25A;text-decoration:none" href="https://www.instagram.com/frambuhobby/" target="_blank" rel="noopener"><span>Hecho por </span><span translate="no">Frambu</span></a></span>
    <nav class="ftl" aria-label="Enlaces">
      <a href="https://adeptus-baeticus.blogspot.com" target="_blank" rel="noopener">Blog</a>
      <a href="https://www.instagram.com/adeptusbaeticus/" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
    </nav>
  </footer>
</div>
<script>
const $ = (id) => document.getElementById(id);

function localNow() {
  const t = new Date();
  t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  return t.toISOString().slice(0, 16);
}

function el(tag, cls, txt) {
  const x = document.createElement(tag);
  if (cls) x.className = cls;
  if (txt != null) x.textContent = txt;
  return x;
}

function section(box, title, items, future) {
  box.textContent = "";
  if (!items.length) return;
  box.appendChild(el("h2", "", title));
  items.forEach((r) => {
    const row = el("div", "row card");
    const info = el("div");
    const tit = el("strong", "", r.title);
    tit.setAttribute("translate", "no");
    info.appendChild(tit);
    const f = new Date(r.starts_at).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    info.appendChild(el("div", "m", f + " · " + r.starts_at.slice(11, 16) + (r.location ? " · " + r.location : "")));
    let st;
    if (r.event_status === "cancelado") st = el("div", "st x", "Evento cancelado");
    else if (r.status === "inscrito") st = el("div", "st ok", "Inscrito");
    else st = el("div", "st w", "Lista de espera" + (r.posicion ? " · posición " + r.posicion : ""));
    info.appendChild(st);
    const det = [];
    if (r.plan) det.push(r.plan);
    if (r.companeros && r.companeros.length) det.push("Compañero: " + r.companeros.join(", "));
    if (r.rivales && r.rivales.length) det.push((r.activity === "necromunda" ? "Participantes: " : "Rival: ") + r.rivales.join(", "));
    if (r.looking) det.push("Buscando rival");
    if (r.inscrito_por) det.push("Te inscribió " + r.inscrito_por);
    if (det.length) info.appendChild(el("div", "m", det.join(" · ")));
    row.appendChild(info);
    if (future && r.event_status !== "cancelado") {
      const acts = el("div");
      const b = el("button", "chip", "Cancelar inscripción");
      b.type = "button";
      const err = el("div", "err");
      b.onclick = () => cancel(r, b, err);
      acts.append(b, err);
      row.appendChild(acts);
    }
    box.appendChild(row);
  });
}

async function cancel(r, b, err) {
  if (!confirm("¿Cancelar tu inscripción en «" + r.title + "»?")) return;
  b.disabled = true;
  err.textContent = "";
  try {
    const res = await fetch("/api/events/" + r.id + "/register", { method: "DELETE" });
    if (res.ok || res.status === 404) { await load(); return; }
    const d = await res.json().catch(() => ({}));
    err.textContent = d.error || "No se pudo cancelar.";
  } catch (x) {
    err.textContent = "No se pudo cancelar.";
  }
  b.disabled = false;
}

async function load() {
  let res;
  try { res = await fetch("/api/my-registrations"); } catch (x) { $("msg").textContent = "No se pudieron cargar tus inscripciones."; return; }
  if (res.status === 401) {
    $("msg").textContent = "";
    const a = el("a", "btn", "Entra con Discord para ver tus inscripciones");
    a.href = "/auth/login";
    $("msg").appendChild(a);
    return;
  }
  if (!res.ok) { $("msg").textContent = "No se pudieron cargar tus inscripciones."; return; }
  const list = await res.json();
  const now = localNow();
  const fut = list.filter((r) => r.starts_at > now);
  const past = list.filter((r) => r.starts_at <= now).reverse();
  $("msg").textContent = list.length ? "" : "Aún no te has apuntado a ninguna quedada.";
  if (!list.length) {
    $("msg").append(" ");
    const a = el("a", "", "Ver el calendario");
    a.href = "/calendario.html";
    $("msg").appendChild(a);
  }
  section($("prox"), "Próximas", fut, true);
  section($("pas"), "Pasadas", past, false);
}

// ===== Mis partidas =====
const CORTO = { combat_patrol: "Combat Patrol", "40k_1000": "40k a 1K", "40k_2000": "40k a 2K", necromunda: "Necromunda", bloodbowl: "Blood Bowl" };
const fechaLarga = (d) => new Date(d + "T12:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

function partidaTitulo(p) {
  let t = CORTO[p.activity] || p.activity;
  if (p.activity === "necromunda") t += " · " + p.players + " participantes";
  else if (p.activity === "combat_patrol" || p.activity === "40k_1000") t += " · " + p.format.replace("v", "vs");
  return t;
}

async function loadPartidas() {
  const box = $("parts");
  let list = [];
  try { const r = await fetch("/api/partidas"); if (r.ok) list = await r.json(); } catch (x) {}
  list = list.filter((p) => p.dentro);
  box.textContent = "";
  if (!list.length) return;
  box.appendChild(el("h2", "", "Mis partidas"));
  const now = localNow();
  const cerrada = (p) => (p.starts_at ? p.starts_at <= now : p.last_day < now.slice(0, 10));

  // Borrar en bloque las partidas que he publicado y aún no han pasado.
  const mias = list.filter((p) => p.mia && !cerrada(p));
  const vacias = mias.filter((p) => p.jugadores.length <= 1);
  if (mias.length) {
    const g = el("div", "row");
    g.style.justifyContent = "flex-start";
    const err = el("div", "err");
    const mk = (txt, solo, n) => {
      const b = el("button", "chip", txt);
      b.type = "button";
      b.disabled = !n;
      b.onclick = async () => {
        const q = solo ? "¿Borrar tus " + n + " partidas sin rivales?"
          : "¿Borrar todas tus partidas (" + n + ")? Las que ya tienen rivales también desaparecerán.";
        if (!confirm(q)) return;
        b.disabled = true;
        err.textContent = "";
        try {
          const r = await fetch("/api/partidas" + (solo ? "?solo=vacias" : ""), { method: "DELETE" });
          if (r.ok) { await loadPartidas(); return; }
          const d = await r.json().catch(() => ({}));
          err.textContent = d.error || "No se pudo borrar.";
        } catch (x) { err.textContent = "No se pudo borrar."; }
        b.disabled = false;
      };
      return b;
    };
    g.append(mk("Borrar mis partidas vacías (" + vacias.length + ")", true, vacias.length), mk("Borrar todas (" + mias.length + ")", false, mias.length));
    box.append(g, err);
  }
  const key = (p) => p.starts_at || p.availability[0].date;
  list.sort((a, b) => (cerrada(a) - cerrada(b)) || (key(a) < key(b) ? -1 : 1));
  list.forEach((p) => {
    const row = el("div", "row card");
    const info = el("div");
    info.appendChild(el("strong", "", partidaTitulo(p)));
    if (p.starts_at) info.appendChild(el("div", "m", fechaLarga(p.starts_at.slice(0, 10)) + " · " + p.starts_at.slice(11, 16)));
    else info.appendChild(el("div", "m", "Sin fecha aún. Puede: " + p.availability.map((x) => fechaLarga(x.date) + " de " + x.from + " a " + x.to).join("; ")));
    const names = (side, total) => {
      const xs = p.jugadores.filter((j) => j.side === side).map((j) => (j.yo ? "tú" : j.name));
      while (xs.length < total) xs.push("hueco libre");
      return xs;
    };
    info.appendChild(el("div", "m", p.activity === "necromunda"
      ? "Participantes: " + names("A", p.team_a).concat(names("B", p.team_b)).join(", ")
      : names("A", p.team_a).join(" y ") + " contra " + names("B", p.team_b).join(" y ")));
    const c = cerrada(p);
    if (c) info.appendChild(el("div", "st", "Cerrada"));
    else if (p.status === "completa") info.appendChild(el("div", "st ok", "Completa · " + (p.mesa ? "Mesa " + p.mesa : "sin mesa libre")));
    else info.appendChild(el("div", "st w", "Abierta · falta" + (p.faltan > 1 ? "n " : " ") + p.faltan));
    row.appendChild(info);
    if (!c) {
      const acts = el("div");
      const b = el("button", "chip", p.mia ? "Retirar partida" : "Salir de la partida");
      b.type = "button";
      const err = el("div", "err");
      b.onclick = async () => {
        if (!confirm(p.mia ? "¿Retirar esta partida? Desaparecerá del calendario para todos." : "¿Salir de esta partida?")) return;
        b.disabled = true;
        err.textContent = "";
        try {
          const r = await fetch("/api/partidas/" + p.id + (p.mia ? "" : "/join"), { method: "DELETE" });
          if (r.ok || r.status === 404) { await loadPartidas(); return; }
          const d = await r.json().catch(() => ({}));
          err.textContent = d.error || "No se pudo completar.";
        } catch (x) { err.textContent = "No se pudo completar."; }
        b.disabled = false;
      };
      acts.append(b, err);
      row.appendChild(acts);
    }
    box.appendChild(row);
  });
}

load();
loadPartidas();
</script>
<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
</html>
